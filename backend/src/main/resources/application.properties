quarkus.http.root-path=/api/v1

quarkus.dynamodb.aws.region=eu-west-2

# Dev profile — point at LocalStack
%dev.quarkus.dynamodb.endpoint-override=http://localhost:4566
%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test

sudoku.cors.allowed-origins=http://localhost:5173

mp.openapi.scan.disable=true
quarkus.swagger-ui.always-include=false

# API request/response logging — dev profile only
%dev.sudoku.api.logging.enabled=true
sudoku.api.logging.enabled=false
