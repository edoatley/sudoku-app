name: CI + Deploy (main)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci-checks.yml
    secrets: inherit

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: ci
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'openapi.yaml'
            frontend:
              - 'ui/**'

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ci, changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/build-lambda-zip
      - name: Upload Lambda zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: lambda-zip
          path: backend/target/function.zip
          retention-days: 1

  build-image-recognition:
    name: Build Image Recognition Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/configure-aws-oidc
        with:
          role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image recognition image
        id: push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: sudoku-image-recognition
          SHA: ${{ github.sha }}
        run: |
          IMAGE_URI="${REGISTRY}/${REPO}:main-sha-${SHA}"
          docker build -t "${IMAGE_URI}" -t "${REGISTRY}/${REPO}:main-latest" image_recognition/
          docker push "${IMAGE_URI}"
          docker push "${REGISTRY}/${REPO}:main-latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [ci, changes, build-backend, build-image-recognition]
    if: always() && !failure() && !cancelled()
    outputs:
      api_gateway_url: ${{ steps.outputs.outputs.api_gateway_url }}
      amplify_app_url: ${{ steps.outputs.outputs.amplify_app_url }}
      amplify_default_url: ${{ steps.outputs.outputs.amplify_default_url }}
      cognito_user_pool_id: ${{ steps.outputs.outputs.cognito_user_pool_id }}
      cognito_client_id: ${{ steps.outputs.outputs.cognito_client_id }}
      cognito_smoke_test_client_id: ${{ steps.outputs.outputs.cognito_smoke_test_client_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/configure-aws-oidc
        with:
          role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Download freshly built Lambda zip
        if: needs.changes.outputs.backend == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lambda-zip
          path: backend/target/

      - name: Download current Lambda zip from S3 (no backend changes)
        id: s3-download
        if: needs.changes.outputs.backend != 'true'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="sudoku-lambda-zip-${ACCOUNT_ID}"
          mkdir -p backend/target
          if aws s3 ls "s3://${BUCKET}/default/function.zip" > /dev/null 2>&1; then
            echo "Downloading current zip from s3://${BUCKET}/default/function.zip"
            aws s3 cp "s3://${BUCKET}/default/function.zip" backend/target/function.zip
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-java
        if: steps.s3-download.outputs.needs_build == 'true'

      - name: Build Lambda zip (S3 fallback — no prior deployment found)
        if: steps.s3-download.outputs.needs_build == 'true'
        uses: ./.github/actions/build-lambda-zip

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Select default Terraform workspace
        working-directory: infra
        run: terraform workspace select default

      - name: Terraform plan (all resources except domain association)
        working-directory: infra
        run: >-
          terraform plan -out=tfplan-phase1
          -input=false
          -var="exclude_amplify_domain=true"
          -var "github_token=${{ secrets.AMPLIFY_GITHUB_TOKEN }}"
          -var "environment=prod"
          -var "google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}"
          -var "google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}"
          -var "smoke_test_user_email=${{ secrets.SMOKE_TEST_USER_EMAIL }}"
          -var "smoke_test_user_password=${{ secrets.SMOKE_TEST_USER_PASSWORD }}"
          -var "image_recognition_image_uri=${{ needs.build-image-recognition.outputs.image_uri }}"

      - name: Terraform apply (all resources except domain association)
        working-directory: infra
        run: terraform apply -auto-approve -input=false tfplan-phase1

      - name: Print Route53 NS records
        # Print NS records immediately after the zone is created so they are
        # visible in the logs even if the domain association step times out.
        # Copy these into infra/scripts/delegate-dns.sh to complete DNS delegation.
        working-directory: infra
        run: |
          if terraform output -json subdomain_nameservers | jq -e 'length > 0' > /dev/null 2>&1; then
            echo "========================================================"
            echo "  Route53 NS records for sudoku.edoatley.co.uk"
            echo "  Run infra/scripts/delegate-dns.sh with these values:"
            echo "========================================================"
            terraform output -json subdomain_nameservers | jq -r '.[]'
            echo "========================================================"
          fi

      # Needs to run after phase 1 to avoid a stale plan
      - name: Terraform plan
        working-directory: infra
        run: >-
          terraform plan -out=tfplan
          -input=false
          -var "github_token=${{ secrets.AMPLIFY_GITHUB_TOKEN }}"
          -var "environment=prod"
          -var "google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}"
          -var "google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}"
          -var "smoke_test_user_email=${{ secrets.SMOKE_TEST_USER_EMAIL }}"
          -var "smoke_test_user_password=${{ secrets.SMOKE_TEST_USER_PASSWORD }}"
          -var "image_recognition_image_uri=${{ needs.build-image-recognition.outputs.image_uri }}"

      - name: Terraform apply (domain association — may take up to 40 min for ACM)
        # Phase 2: apply the original full plan which includes the domain association.
        working-directory: infra
        run: terraform apply -auto-approve -input=false tfplan

      - name: Capture outputs
        id: outputs
        working-directory: infra
        run: |
          echo "api_gateway_url=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"
          echo "amplify_app_url=$(terraform output -raw amplify_app_url)" >> "$GITHUB_OUTPUT"
          echo "amplify_default_url=$(terraform output -raw amplify_default_url)" >> "$GITHUB_OUTPUT"
          echo "api_id=$(terraform output -raw api_gateway_api_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_smoke_test_client_id=$(terraform output -raw cognito_smoke_test_client_id)" >> "$GITHUB_OUTPUT"
          # cognito_smoke_test_client_secret is sensitive — fetched directly in smoke-test job via AWS API

      - name: Tighten CORS to exact Amplify URL
        env:
          AMPLIFY_URL: ${{ steps.outputs.outputs.amplify_app_url }}
          AMPLIFY_DEFAULT_URL: ${{ steps.outputs.outputs.amplify_default_url }}
          API_ID: ${{ steps.outputs.outputs.api_id }}
        run: |
          CORS_CONFIG=$(printf '{"AllowMethods":["GET","POST","PATCH","OPTIONS"],"AllowOrigins":["%s","%s","http://localhost:5173"],"AllowHeaders":["Content-Type","Authorization"],"MaxAge":300}' "${AMPLIFY_URL}" "${AMPLIFY_DEFAULT_URL}")
          aws apigatewayv2 update-api --api-id "${API_ID}" --cors-configuration "${CORS_CONFIG}"

      - name: Tighten Cognito callback URLs to exact Amplify URL
        env:
          AMPLIFY_URL: ${{ steps.outputs.outputs.amplify_app_url }}
          AMPLIFY_DEFAULT_URL: ${{ steps.outputs.outputs.amplify_default_url }}
          USER_POOL_ID: ${{ steps.outputs.outputs.cognito_user_pool_id }}
          CLIENT_ID: ${{ steps.outputs.outputs.cognito_client_id }}
        run: |
          aws cognito-idp update-user-pool-client \
            --user-pool-id "${USER_POOL_ID}" \
            --client-id "${CLIENT_ID}" \
            --callback-urls "${AMPLIFY_URL}/" "${AMPLIFY_DEFAULT_URL}/" "https://sudoku.edoatley.co.uk/" "http://localhost:5173/" \
            --logout-urls "${AMPLIFY_URL}/" "${AMPLIFY_DEFAULT_URL}/" "https://sudoku.edoatley.co.uk/" "http://localhost:5173/" \
            --supported-identity-providers "Google" \
            --allowed-o-auth-flows "code" \
            --allowed-o-auth-scopes "openid" "email" "profile" \
            --allowed-o-auth-flows-user-pool-client \
            --explicit-auth-flows ALLOW_USER_PASSWORD_AUTH ALLOW_REFRESH_TOKEN_AUTH

      - name: Trigger Amplify build and wait
        if: needs.changes.outputs.frontend == 'true'
        working-directory: infra
        run: |
          APP_ID=$(terraform output -raw amplify_app_id)
          echo "Triggering Amplify build for branch main on app ${APP_ID}"
          JOB_ID=$(aws amplify start-job \
            --app-id "${APP_ID}" \
            --branch-name "main" \
            --job-type RELEASE \
            --query 'jobSummary.jobId' --output text)
          echo "Amplify job ID: ${JOB_ID}"

          # Wait up to 10 minutes for the build to complete
          for i in $(seq 1 40); do
            STATUS=$(aws amplify get-job \
              --app-id "${APP_ID}" \
              --branch-name "main" \
              --job-id "${JOB_ID}" \
              --query 'job.summary.status' --output text)
            echo "Attempt ${i}/40 → ${STATUS}"
            case "${STATUS}" in
              SUCCEED) echo "Amplify build succeeded"; break ;;
              FAILED|CANCELLED) echo "Amplify build ${STATUS}"; exit 1 ;;
            esac
            [ "${i}" = "40" ] && { echo "Amplify build timed out"; exit 1; }
            sleep 15
          done

      - name: Print deployment URLs
        working-directory: infra
        run: terraform output

  smoke-test:
    name: Smoke Tests
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    uses: ./.github/workflows/smoke-tests.yml
    secrets: inherit
    with:
      api_gateway_url: ${{ needs.deploy.outputs.api_gateway_url }}
      amplify_app_url: ${{ needs.deploy.outputs.amplify_app_url }}
      amplify_default_url: ${{ needs.deploy.outputs.amplify_default_url }}
      cognito_user_pool_id: ${{ needs.deploy.outputs.cognito_user_pool_id }}
      cognito_client_id: ${{ needs.deploy.outputs.cognito_client_id }}
      environment_type: main

  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy, smoke-test]
    if: always()
    steps:
      - name: Deployment summary
        env:
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          SMOKE_STATUS: ${{ needs.smoke-test.result }}
          API_URL: ${{ needs.deploy.outputs.api_gateway_url }}
          APP_URL: ${{ needs.deploy.outputs.amplify_app_url }}
          DEFAULT_URL: ${{ needs.deploy.outputs.amplify_default_url }}
          USER_POOL_ID: ${{ needs.deploy.outputs.cognito_user_pool_id }}
          CLIENT_ID: ${{ needs.deploy.outputs.cognito_client_id }}
        run: |
          if [ "${DEPLOY_STATUS}" = "success" ]; then
            echo "### Deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Resource | URL |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-----|" >> "$GITHUB_STEP_SUMMARY"
            echo "| API Gateway | ${API_URL} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Amplify App | ${APP_URL} |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Re-run smoke tests manually" >> "$GITHUB_STEP_SUMMARY"
            echo "Use these values in the [Smoke Tests](../actions/workflows/smoke-tests.yml) \`workflow_dispatch\`:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Input | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`api_gateway_url\` | \`${API_URL}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`amplify_app_url\` | \`${APP_URL}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`amplify_default_url\` | \`${DEFAULT_URL}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`cognito_user_pool_id\` | \`${USER_POOL_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`cognito_client_id\` | \`${CLIENT_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`environment_type\` | \`main\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deployment failed (status: ${DEPLOY_STATUS})" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the deploy job logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${SMOKE_STATUS}" = "success" ]; then
            echo "### Smoke tests passed ✅" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${SMOKE_STATUS}" = "skipped" ]; then
            echo "### Smoke tests skipped ⏭️" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Smoke tests failed ❌ (status: ${SMOKE_STATUS})" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the smoke-test job logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Delete lambda-zip artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[] | select(.name == "lambda-zip") | .id' | xargs -I{} gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/{}
