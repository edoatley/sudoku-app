# Overlay for docker-compose.test.yml that enables real Bedrock calls from the coach
# endpoint, for the opt-in AI coach quality suite (ui/tests/coach-quality/).
#
# Usage:
#   AWS_PROFILE=sandbox bash scripts/local/coach-quality-test.sh
#
# Forwards real AWS credentials into the backend container so BedrockRuntimeClient's
# default credential chain (backend/src/main/java/.../BedrockClientProducer.java) can
# actually call Bedrock, instead of always falling back as it does under plain
# docker-compose.test.yml (no credentials there by design — see ui/tests/integration/).
#
# No `ui` override here: the suite talks to the backend REST API directly (see
# ui/tests/coach-quality/lib/apiClient.js), so the browser/UI container is never started —
# scripts/local/coach-quality-test.sh passes an explicit service list to `docker compose up`
# that omits it (a compose override file can't remove a base-file service, only merge into
# one that does get started).
services:
  dynamodb-setup-coach-quality:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url=http://dynamodb-local:8000 dynamodb list-tables --region us-east-1 > /dev/null 2>&1; do
          echo "Waiting for DynamoDB Local..."; sleep 2;
        done
        aws --endpoint-url=http://dynamodb-local:8000 dynamodb create-table \
          --table-name SudokuCoachRateLimits \
          --attribute-definitions AttributeName=userId,AttributeType=S AttributeName=window,AttributeType=S \
          --key-schema AttributeName=userId,KeyType=HASH AttributeName=window,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          --region us-east-1 2>&1 | grep -v ResourceInUseException || true
    depends_on:
      - dynamodb-local

  backend:
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID must be set — see scripts/local/coach-quality-test.sh}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY must be set}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_REGION: "${AWS_REGION:-eu-west-2}"
      COACH_RATE_LIMIT_PER_MINUTE: "100"
    depends_on:
      dynamodb-setup-coach-quality:
        condition: service_completed_successfully
