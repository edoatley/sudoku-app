name: CI (push)

on:
  push:
    branches: ["**"]

jobs:
  ui-lint:
    name: UI — Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - name: Lint
        run: npm run lint

  backend-unit:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - "4566:4566"
        env:
          SERVICES: dynamodb
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-java
      - name: Create DynamoDB table in LocalStack
        run: |
          aws --endpoint-url=http://localhost:4566 dynamodb create-table \
            --table-name SudokuGames \
            --attribute-definitions AttributeName=gameId,AttributeType=S \
            --key-schema AttributeName=gameId,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
      - name: Run unit tests
        run: ./mvnw test
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

  infra:
    name: Infra — Terraform fmt & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-terraform
      - name: Terraform format check
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate
