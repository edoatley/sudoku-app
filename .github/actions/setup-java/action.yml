name: Setup Java
description: Install Java 21 (Temurin) with Maven cache

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
