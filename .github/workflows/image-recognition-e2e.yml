name: Image Recognition — Bedrock E2E Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform workspace / environment to test (e.g. default, rc-puzzle-import)"
        required: true
        default: "default"

permissions:
  id-token: write
  contents: read

jobs:
  e2e:
    name: Bedrock E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: image_recognition
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/configure-aws-oidc
        with:
          role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: image_recognition/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Bedrock e2e tests
        run: pytest tests/test_e2e_bedrock.py -v -m e2e -s
        env:
          AWS_DEFAULT_REGION: eu-west-2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bedrock-e2e-results
          path: image_recognition/.pytest_cache/
          retention-days: 7
