quarkus.http.root-path=/api/v1

quarkus.dynamodb.aws.region=eu-west-2

# Dev profile — point at LocalStack
%dev.quarkus.dynamodb.endpoint-override=http://localhost:4566
%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test

# Integration test profile — point at LocalStack
%it.quarkus.dynamodb.endpoint-override=http://localhost:4566
%it.quarkus.dynamodb.aws.region=us-east-1
%it.quarkus.dynamodb.aws.credentials.type=static
%it.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%it.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test
%it.quarkus.dynamodb.sync-client.connection-timeout=3S
%it.quarkus.dynamodb.sync-client.socket-timeout=5S
%it.quarkus.dynamodb.aws.api-call-timeout=8S
%it.quarkus.dynamodb.aws.api-attempt-timeout=5S

sudoku.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
sudoku.dynamodb.table-name=${DYNAMODB_TABLE_NAME:SudokuGames}
sudoku.dynamodb.players-table-name=${PLAYERS_TABLE_NAME:SudokuPlayers}
sudoku.dynamodb.leaderboard-table-name=${LEADERBOARD_TABLE_NAME:SudokuLeaderboard}

# OIDC — SecurityContext is populated from the JWT injected by API Gateway's JWT Authorizer.
# The Lambda never re-validates the token; it trusts the claims API Gateway has already verified.
quarkus.oidc.auth-server-url=${COGNITO_ISSUER_URL:https://cognito-idp.eu-west-2.amazonaws.com/placeholder}
quarkus.oidc.client-id=${COGNITO_CLIENT_ID:placeholder}
quarkus.oidc.application-type=service

# Test profile — DynamoDbGameRepository is replaced by @InjectMock; disable health check and DevServices so no Docker/connection is attempted
%test.quarkus.dynamodb.devservices.enabled=false
%test.quarkus.dynamodb.health.enabled=false
%test.quarkus.dynamodb.aws.region=us-east-1
%test.quarkus.dynamodb.aws.credentials.type=static
%test.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%test.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test

# Dev + IT + test profiles — disable OIDC enforcement; DevUserFilter injects a mock userId instead
%dev.quarkus.oidc.enabled=false
%dev.quarkus.http.auth.proactive=false
%dev.quarkus.oidc.auth-server-url=http://localhost:8080/disabled-oidc
%dev.quarkus.oidc.discovery-enabled=false
%it.quarkus.oidc.enabled=false
%it.quarkus.http.auth.proactive=false
%test.quarkus.oidc.enabled=false
%test.quarkus.http.auth.proactive=false

# Comma-separated list of authorised email addresses.
# Empty string (default) disables the check — used in dev/test profiles.
# Populated for production to restrict access to known test users.
app.allowed.emails=
%prod.app.allowed.emails=edoatley@gmail.com,hanoatley@gmail.com,edoatley2@gmail.com,edoatley+sudokuapp@icloud.com

mp.openapi.scan.disable=true
quarkus.swagger-ui.always-include=false

coach.bedrock.model-id=${COACH_BEDROCK_MODEL_ID:eu.anthropic.claude-haiku-4-5-20251001-v1:0}
%test.coach.bedrock.model-id=test-model-id

# API request/response logging — dev profile only
%dev.sudoku.api.logging.enabled=true
sudoku.api.logging.enabled=false
