name: CI

on:
  push:
    branches:
      - "**"
      - "!main"
      - "!rc-*"
  pull_request:
    branches: ["**"]

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_dependabot: ${{ steps.meta.outputs.is_dependabot }}
      npm_changed: ${{ steps.filter.outputs.npm }}
      maven_changed: ${{ steps.filter.outputs.maven }}
      terraform_changed: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v7
      - name: Set actor metadata
        id: meta
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            npm:
              - 'ui/**'
            maven:
              - 'backend/**'
            terraform:
              - 'infra/aws/**'
              - '.github/**'

  ci-npm:
    name: UI — Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.is_dependabot == 'false' || needs.detect-changes.outputs.npm_changed == 'true'
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          install-playwright: "true"
      - name: Lint
        run: npm run lint
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-unit-results
          path: ui/test-results/unit-results.xml
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-coverage
          path: ui/coverage/coverage-summary.json
          retention-days: 14
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14
      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: ui/test-results/results.xml
          retention-days: 14

  ci-maven:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.is_dependabot == 'false' || needs.detect-changes.outputs.maven_changed == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java
      - name: Run unit and API tests with coverage
        run: ./mvnw -B -ntp verify -T 1C
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14
      - name: Upload surefire & failsafe XML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            backend/target/surefire-reports/TEST-*.xml
            backend/target/failsafe-reports/TEST-*.xml
          retention-days: 14

  ci-infra:
    name: Infra — Terraform fmt & validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.outputs.is_dependabot == 'false' || needs.detect-changes.outputs.terraform_changed == 'true'
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - uses: ./.github/actions/terraform-validate

  integration:
    name: Integration — Native Servers + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes, ci-npm, ci-maven]
    if: |
      always() &&
      needs.detect-changes.outputs.is_dependabot == 'false' &&
      (needs.ci-npm.result == 'success' || needs.ci-npm.result == 'skipped') &&
      (needs.ci-maven.result == 'success' || needs.ci-maven.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/start-localstack
        with:
          auth-token: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - uses: ./.github/actions/integration-tests
        with:
          report-artifact-name: integration-playwright-report
          upload-results: "true"
          results-artifact-name: integration-results

  report:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.event_name == 'pull_request'
    needs: [ci-npm, ci-maven, integration, ci-infra]
    permissions:
      pull-requests: write
    steps:
      - name: Download backend test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: backend-test-results
          path: artifacts/backend

      - name: Download JaCoCo coverage report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: jacoco-report
          path: artifacts/jacoco

      - name: Download UI unit test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ui-unit-results
          path: artifacts/ui-unit

      - name: Download UI coverage summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ui-coverage
          path: artifacts/ui-coverage

      - name: Download E2E test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-results
          path: artifacts/e2e

      - name: Download integration test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: integration-results
          path: artifacts/integration

      - name: Parse test results and post PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function collectXml(dir) {
              if (!fs.existsSync(dir)) return [];
              return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
                const full = path.join(dir, entry.name);
                return entry.isDirectory() ? collectXml(full) : (entry.name.endsWith('.xml') ? [full] : []);
              });
            }

            function parseJUnit(dir) {
              let tests = 0, failures = 0, errors = 0, skipped = 0;
              const files = collectXml(dir);
              if (files.length === 0) return null;
              for (const file of files) {
                const xml = fs.readFileSync(file, 'utf8');
                const suites = [...xml.matchAll(/<testsuite[^>]+>/g)];
                for (const suite of suites) {
                  tests    += parseInt(suite[0].match(/\btests="(\d+)"/)?.[1]    ?? '0');
                  failures += parseInt(suite[0].match(/\bfailures="(\d+)"/)?.[1] ?? '0');
                  errors   += parseInt(suite[0].match(/\berrors="(\d+)"/)?.[1]   ?? '0');
                  skipped  += parseInt(suite[0].match(/\bskipped="(\d+)"/)?.[1]  ?? '0');
                }
              }
              const passed = tests - failures - errors - skipped;
              return { tests, passed, failures, errors, skipped };
            }

            function fmtCounts(r) {
              if (!r) return '_no data_';
              const parts = [`${r.passed}/${r.tests} passed`];
              if (r.failures > 0) parts.push(`${r.failures} failed`);
              if (r.errors   > 0) parts.push(`${r.errors} errors`);
              if (r.skipped  > 0) parts.push(`${r.skipped} skipped`);
              return parts.join(', ');
            }

            function parseJaCoCo(dir) {
              const xmlPath = path.join(dir, 'jacoco.xml');
              if (!fs.existsSync(xmlPath)) return null;
              const xml = fs.readFileSync(xmlPath, 'utf8');
              const m = xml.match(/<counter type="LINE" missed="(\d+)" covered="(\d+)"/);
              if (!m) return null;
              const missed  = parseInt(m[1]);
              const covered = parseInt(m[2]);
              const total   = missed + covered;
              return total > 0 ? ((covered / total) * 100).toFixed(1) : '0.0';
            }

            function parseVitestCoverage(dir) {
              const summaryPath = path.join(dir, 'coverage-summary.json');
              if (!fs.existsSync(summaryPath)) return null;
              try {
                const data = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
                const t = data.total;
                if (!t) return null;
                return {
                  lines: t.lines?.pct ?? null,
                  statements: t.statements?.pct ?? null,
                  functions: t.functions?.pct ?? null,
                };
              } catch { return null; }
            }

            const backend     = parseJUnit('artifacts/backend');
            const unitTests   = parseJUnit('artifacts/ui-unit');
            const e2e         = parseJUnit('artifacts/e2e');
            const integration = parseJUnit('artifacts/integration');

            const backendCovPct  = parseJaCoCo('artifacts/jacoco');
            const uiCov          = parseVitestCoverage('artifacts/ui-coverage');

            const jobResults = {
              'UI — Lint & Unit Tests':                     '${{ needs.ci-npm.result }}',
              'Backend — Unit Tests':                       '${{ needs.ci-maven.result }}',
              'Integration — Native Servers + Playwright':  '${{ needs.integration.result }}',
              'Infra — Terraform fmt & validate':           '${{ needs.ci-infra.result }}',
            };

            const icon = (r) => r === 'success' ? '✅' : r === 'failure' ? '❌' : r === 'skipped' ? '⏭️' : '⚠️';
            const allPassed = Object.values(jobResults).every(r => r === 'success' || r === 'skipped');
            const overall = allPassed ? '✅ All checks passed' : '❌ Some checks failed';

            const jobRows = Object.entries(jobResults)
              .map(([name, result]) => `| ${icon(result)} | ${name} | \`${result}\` |`)
              .join('\n');

            const backendCovStr = backendCovPct  ? `${backendCovPct}% line` : '_n/a_';
            const uiCovStr      = uiCov?.lines   ? `${uiCov.lines}% line`  : '_n/a_';

            const testRows = [
              `| 🧪 Backend unit & API tests | ${fmtCounts(backend)}   | ${backendCovStr} |`,
              `| 🔬 UI unit tests (Vitest)    | ${fmtCounts(unitTests)} | ${uiCovStr} |`,
              `| 🎭 UI E2E (Playwright)        | ${fmtCounts(e2e)}       | _n/a_ |`,
              `| 🔗 Full-stack integration     | ${fmtCounts(integration)} | _n/a_ |`,
            ].join('\n');

            const body = [
              `## CI Results — ${overall}`,
              '',
              '### Jobs',
              '| | Job | Result |',
              '|---|---|---|',
              jobRows,
              '',
              '### Test counts & coverage',
              '| Suite | Results | Coverage |',
              '|---|---|---|',
              testRows,
              '',
              `> Run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.startsWith('## CI Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
