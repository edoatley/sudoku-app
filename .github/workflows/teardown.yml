name: Teardown

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm teardown of all Terraform-managed resources'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard — require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "Confirmation input was not 'DESTROY'. Aborting."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - uses: ./.github/actions/setup-terraform

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform destroy
        working-directory: infra
        run: >-
          terraform destroy
          -auto-approve
          -var "github_token=${{ secrets.AMPLIFY_GITHUB_TOKEN }}"
          -var "lambda_zip_path=/dev/null"

      - name: Bootstrap resources reminder
        run: |
          echo "### Teardown complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The following bootstrap resources were **NOT** destroyed and must be cleaned up manually if needed:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- S3 bucket: \`sudoku-tf-state\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- DynamoDB table: \`sudoku-tf-locks\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- IAM OIDC provider: \`token.actions.githubusercontent.com\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- IAM role: \`sudoku-github-actions-deploy\`" >> "$GITHUB_STEP_SUMMARY"
