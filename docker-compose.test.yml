services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"

  dynamodb-setup:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until aws --endpoint-url=http://dynamodb-local:8000 dynamodb list-tables --region us-east-1 > /dev/null 2>&1; do
          echo "Waiting for DynamoDB Local..."; sleep 2;
        done &&
        aws --endpoint-url=http://dynamodb-local:8000 dynamodb create-table
        --table-name SudokuGames
        --attribute-definitions AttributeName=userId,AttributeType=S AttributeName=gameId,AttributeType=S
        --key-schema AttributeName=userId,KeyType=HASH AttributeName=gameId,KeyType=RANGE
        --billing-mode PAY_PER_REQUEST
        --region us-east-1 &&
        aws --endpoint-url=http://dynamodb-local:8000 dynamodb create-table
        --table-name SudokuPlayers
        --attribute-definitions AttributeName=userId,AttributeType=S
        --key-schema AttributeName=userId,KeyType=HASH
        --billing-mode PAY_PER_REQUEST
        --region us-east-1
    depends_on:
      - dynamodb-local

  backend:
    image: sudoku-app-backend:latest
    build:
      context: backend
      dockerfile: Dockerfile.test
    ports:
      - "8080:8080"
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:5174,http://ui:5174"
      QUARKUS_DYNAMODB_ENDPOINT_OVERRIDE: "http://dynamodb-local:8000"
      QUARKUS_DYNAMODB_AWS_REGION: "us-east-1"
      QUARKUS_DYNAMODB_AWS_CREDENTIALS_TYPE: "static"
      QUARKUS_DYNAMODB_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: "test"
      QUARKUS_DYNAMODB_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: "test"
      SUDOKU_API_LOGGING_ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/puzzles/generate"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s
    depends_on:
      dynamodb-setup:
        condition: service_completed_successfully

  ui:
    image: sudoku-app-ui:latest
    build:
      context: ui
      dockerfile: Dockerfile.test
      args:
        VITE_API_URL: "http://localhost:8080/api/v1"
        VITE_MOCK_API: "false"
        VITE_SKIP_AUTH: "true"
        VITE_DEV_TOOLS: "true"
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy
