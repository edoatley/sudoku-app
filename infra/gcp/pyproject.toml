[project]
name = "sudoku-gcp-infra"
version = "0.1.0"
description = "Pulumi infrastructure for the Sudoku app's GCP deployment target"
requires-python = ">=3.12"
dependencies = [
    "pulumi>=3.150,<4.0.0",
    "pulumi-gcp>=9.0,<10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

# The Pulumi programs in bootstrap/ and app/ import `components` as a package. Installing this
# project into the shared venv is what makes `from components.x import Y` resolve from any
# working directory, without sys.path manipulation — and what lets `uv run pytest` work from
# anywhere. @spec CP-PUL-070
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["components"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
