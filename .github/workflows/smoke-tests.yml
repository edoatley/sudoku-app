name: Smoke Tests

on:
  workflow_call:
    inputs:
      api_gateway_url:
        required: true
        type: string
      amplify_app_url:
        required: true
        type: string
      amplify_default_url:
        required: true
        type: string
      cognito_user_pool_id:
        required: true
        type: string
      cognito_client_id:
        description: "Cognito web client ID — used for main; RC resolves by name automatically"
        required: false
        type: string
        default: ""
      environment_type:
        description: "main or rc — controls Lambda warm-up, image fixture, and Cognito client resolution"
        required: true
        type: string
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true
      SMOKE_TEST_USER_EMAIL:
        required: true
      SMOKE_TEST_USER_PASSWORD:
        required: true

  workflow_dispatch:
    inputs:
      api_gateway_url:
        description: "API Gateway invoke URL (with or without trailing slash)"
        required: true
        type: string
      amplify_app_url:
        description: "Amplify custom domain URL (e.g. https://main.d1abc.amplifyapp.com)"
        required: true
        type: string
      amplify_default_url:
        description: "Amplify default URL used to poll readiness"
        required: true
        type: string
      cognito_user_pool_id:
        description: "Cognito User Pool ID"
        required: true
        type: string
      cognito_client_id:
        description: "Cognito web client ID (leave blank for rc — resolved automatically by name)"
        required: false
        type: string
        default: ""
      environment_type:
        description: "Environment type: main or rc"
        required: true
        type: choice
        options:
          - main
          - rc
        default: main

# Reusable workflows do not inherit caller permissions — declare them explicitly.
permissions:
  id-token: write
  contents: read

jobs:
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      api_smoke_result: ${{ steps.api-smoke.outcome }}
      playwright_result: ${{ steps.playwright.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            image_recognition/tests/fixtures
            scripts
            ui
            .github

      - name: Warm up Lambda (RC only — handles cold starts)
        if: inputs.environment_type == 'rc'
        env:
          API_URL: ${{ inputs.api_gateway_url }}
        run: |
          API_BASE="${API_URL%/}"
          # Poll /health until it returns 200 with status:"ok" — the Lambda
          # returns 503 with status:"warming" for ~30 s after a cold start.
          echo "Waiting for Lambda to finish warming up..."
          for i in $(seq 1 24); do
            BODY=$(curl -s -o /tmp/health_warmup.json -w "%{http_code}" --max-time 10 "${API_BASE}/api/v1/health" || echo "000")
            STATUS="${BODY}"
            if [ "${STATUS}" = "200" ] && grep -q '"status":"ok"' /tmp/health_warmup.json 2>/dev/null; then
              echo "Lambda warm (attempt ${i})"
              break
            fi
            WARMUP_STATUS=$(grep -o '"status":"[^"]*"' /tmp/health_warmup.json 2>/dev/null || echo "unknown")
            echo "  attempt ${i}/24: HTTP ${STATUS} ${WARMUP_STATUS} — retrying in 5s..."
            sleep 5
          done

      - name: API smoke tests
        id: api-smoke
        env:
          API_URL: ${{ inputs.api_gateway_url }}
          ENV_TYPE: ${{ inputs.environment_type }}
        run: bash scripts/github/api-smoke-tests.sh "${API_URL}"

      - name: Wait for Amplify deployment to complete
        env:
          APP_URL: ${{ inputs.amplify_default_url }}
        run: |
          echo "Waiting for Amplify app to be reachable at ${APP_URL}"
          for i in $(seq 1 20); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${APP_URL}" || echo "000")
            echo "Attempt ${i}/20 → HTTP ${STATUS}"
            [ "${STATUS}" = "200" ] && { echo "Amplify ready"; break; }
            [ "${i}" = "20" ] && { echo "FAIL: Amplify not ready after 300s"; exit 1; }
            sleep 15
          done

      - name: Wait for custom domain to resolve
        if: inputs.amplify_app_url != inputs.amplify_default_url
        env:
          CUSTOM_URL: ${{ inputs.amplify_app_url }}
        run: |
          echo "Waiting for custom domain ${CUSTOM_URL} to resolve..."
          for i in $(seq 1 20); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 "${CUSTOM_URL}" 2>/dev/null || echo "000")
            echo "Attempt ${i}/20 → HTTP ${STATUS}"
            [ "${STATUS}" = "200" ] && { echo "Custom domain ready"; break; }
            [ "${i}" = "20" ] && { echo "FAIL: Custom domain not ready after 300s"; exit 1; }
            sleep 15
          done

      - uses: ./.github/actions/configure-aws-oidc
        with:
          role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Resolve Cognito client IDs
        id: resolve-client
        env:
          USER_POOL_ID: ${{ inputs.cognito_user_pool_id }}
          WEB_CLIENT_ID_INPUT: ${{ inputs.cognito_client_id }}
          ENV_TYPE: ${{ inputs.environment_type }}
        run: |
          if [[ "${ENV_TYPE}" == "rc" ]]; then
            # RC branches share one Cognito pool — resolve both clients by name.
            WEB_CLIENT_ID=$(aws cognito-idp list-user-pool-clients \
              --user-pool-id "${USER_POOL_ID}" \
              --query "UserPoolClients[?ClientName=='sudoku-web-rc'].ClientId | [0]" \
              --output text)
            SMOKE_CLIENT_NAME="sudoku-smoke-test-rc"
          else
            WEB_CLIENT_ID="${WEB_CLIENT_ID_INPUT}"
            SMOKE_CLIENT_NAME="sudoku-smoke-test"
          fi
          if [[ -z "${WEB_CLIENT_ID}" || "${WEB_CLIENT_ID}" == "None" ]]; then
            echo "::error::Could not resolve web client ID for pool ${USER_POOL_ID}"
            exit 1
          fi

          # The web client is social-login-only (no ALLOW_USER_PASSWORD_AUTH) —
          # CI authenticates as the purpose-built, secret-bearing smoke-test
          # client instead. Its token is still accepted by the API's JWT
          # authorizer (audience includes both clients).
          SMOKE_CLIENT_ID=$(aws cognito-idp list-user-pool-clients \
            --user-pool-id "${USER_POOL_ID}" \
            --query "UserPoolClients[?ClientName=='${SMOKE_CLIENT_NAME}'].ClientId | [0]" \
            --output text)
          if [[ -z "${SMOKE_CLIENT_ID}" || "${SMOKE_CLIENT_ID}" == "None" ]]; then
            echo "::error::Could not resolve smoke-test client ID for pool ${USER_POOL_ID}"
            exit 1
          fi
          SMOKE_CLIENT_SECRET=$(aws cognito-idp describe-user-pool-client \
            --user-pool-id "${USER_POOL_ID}" \
            --client-id "${SMOKE_CLIENT_ID}" \
            --query 'UserPoolClient.ClientSecret' \
            --output text)
          echo "::add-mask::${SMOKE_CLIENT_SECRET}"

          echo "RESOLVED_CLIENT_ID=${WEB_CLIENT_ID}"     >> "$GITHUB_ENV"
          echo "SMOKE_CLIENT_ID=${SMOKE_CLIENT_ID}"       >> "$GITHUB_ENV"
          echo "SMOKE_CLIENT_SECRET=${SMOKE_CLIENT_SECRET}" >> "$GITHUB_ENV"

      - name: Acquire Cognito ID token for smoke test user
        id: get-token
        env:
          USERNAME: ${{ secrets.SMOKE_TEST_USER_EMAIL }}
          PASSWORD: ${{ secrets.SMOKE_TEST_USER_PASSWORD }}
        run: |
          SECRET_HASH=$(printf '%s' "${USERNAME}${SMOKE_CLIENT_ID}" | openssl dgst -sha256 -hmac "${SMOKE_CLIENT_SECRET}" -binary | base64)
          AUTH_PARAMS=$(jq -n \
            --arg u "${USERNAME}" \
            --arg p "${PASSWORD}" \
            --arg h "${SECRET_HASH}" \
            '{"USERNAME": $u, "PASSWORD": $p, "SECRET_HASH": $h}')
          RESPONSE=$(aws cognito-idp initiate-auth \
            --auth-flow USER_PASSWORD_AUTH \
            --client-id "${SMOKE_CLIENT_ID}" \
            --auth-parameters "${AUTH_PARAMS}" \
            --output json)

          ID_TOKEN=$(echo "${RESPONSE}" | jq -r '.AuthenticationResult.IdToken')
          ACCESS_TOKEN=$(echo "${RESPONSE}" | jq -r '.AuthenticationResult.AccessToken')

          # Mask both tokens so they never appear in logs
          echo "::add-mask::${ID_TOKEN}"
          echo "::add-mask::${ACCESS_TOKEN}"

          echo "SMOKE_ID_TOKEN=${ID_TOKEN}"         >> "$GITHUB_ENV"
          echo "SMOKE_ACCESS_TOKEN=${ACCESS_TOKEN}" >> "$GITHUB_ENV"

      - name: Warm up image recognition Lambda (RC only — handles cold starts)
        if: inputs.environment_type == 'rc'
        env:
          API_URL: ${{ inputs.api_gateway_url }}
          SMOKE_ID_TOKEN: ${{ env.SMOKE_ID_TOKEN }}
        run: |
          API_BASE="${API_URL%/}"
          # Send a minimal 1x1 white JPEG — just enough to wake the container.
          # The Lambda will return 422 (too few clues) or 200; both mean it's alive.
          TINY_B64="/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/wAALCAABAAEBAREA/8QAFAABAAAAAAAAAAAAAAAAAAAACf/EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAD8AVIP/2Q=="
          printf '{"image":"%s"}' "$TINY_B64" > /tmp/warmup_body.json
          printf 'Authorization: Bearer %s\n' "${SMOKE_ID_TOKEN}" > /tmp/warmup_auth.txt
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 65 \
            -X POST "${API_BASE}/api/v1/ai/image-to-puzzle" \
            -H "Content-Type: application/json" \
            -H @/tmp/warmup_auth.txt \
            --data-binary @/tmp/warmup_body.json || echo "000")
          echo "Image recognition Lambda warm-up → HTTP ${STATUS}"

      - name: Image recognition smoke test
        id: import-smoke
        env:
          API_URL: ${{ inputs.api_gateway_url }}
          SMOKE_ID_TOKEN: ${{ env.SMOKE_ID_TOKEN }}
        run: |
          bash scripts/github/image-smoke-test.sh "${API_URL}" "image_recognition/tests/fixtures/CI_Puzzle.jpg"

      - uses: ./.github/actions/setup-node
        with:
          install-playwright: "true"

      - name: Run Playwright integration tests against Amplify
        id: playwright
        working-directory: ui
        env:
          CI: "true"
          INTEGRATION_BASE_URL: ${{ inputs.amplify_app_url }}
          COGNITO_USER_POOL_ID: ${{ inputs.cognito_user_pool_id }}
          COGNITO_CLIENT_ID: ${{ env.RESOLVED_CLIENT_ID }}
          SMOKE_ID_TOKEN: ${{ env.SMOKE_ID_TOKEN }}
          SMOKE_ACCESS_TOKEN: ${{ env.SMOKE_ACCESS_TOKEN }}
          ENV_TYPE: ${{ inputs.environment_type }}
        run: |
          # hint-demos require VITE_DEV_TOOLS=true, which is only enabled for RC
          # environments in Amplify — skip them when running against main/prod.
          if [[ "${ENV_TYPE}" == "main" ]]; then
            npx playwright test --config playwright.integration.config.js --grep-invert 'hint demo'
          else
            npx playwright test --config playwright.integration.config.js
          fi

      - name: Upload Playwright integration report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-playwright-report
          path: ui/playwright-report/
          retention-days: 14

      - name: Upload Playwright integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-integration-results
          path: ui/test-results/integration-results.xml
          retention-days: 14

      - name: Smoke test summary
        if: always()
        env:
          API_RESULT: ${{ steps.api-smoke.outcome }}
          IMPORT_RESULT: ${{ steps.import-smoke.outcome }}
          PLAYWRIGHT_RESULT: ${{ steps.playwright.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅ passed";; failure) echo "❌ failed";; skipped) echo "⏭️ skipped";; *) echo "❓ $1";; esac; }
          {
            echo ""
            echo "### Smoke Test Summary"
            echo ""
            echo "| Suite | Result |"
            echo "|-------|--------|"
            echo "| API smoke tests | $(icon "${API_RESULT}") |"
            echo "| Image recognition import | $(icon "${IMPORT_RESULT}") |"
            echo "| Playwright UI tests | $(icon "${PLAYWRIGHT_RESULT}") |"
          } >> "$GITHUB_STEP_SUMMARY"
