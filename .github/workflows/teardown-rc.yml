name: Teardown RC Environment

on:
  delete:
    # Fires for both branch and tag deletions; we filter to rc-* branches below

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    name: Terraform Destroy (rc-* only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # github.event.ref is the deleted ref name; github.event.ref_type is "branch" or "tag"
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'rc-')
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/configure-aws-oidc
        with:
          role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - uses: hashicorp/setup-terraform@v4

      - name: Resolve workspace from deleted branch name
        id: workspace
        run: |
          BRANCH="${{ github.event.ref }}"
          WORKSPACE=$(echo "${BRANCH}" | tr '/' '-' | tr '.' '-' | cut -c1-32)
          echo "Branch '${BRANCH}' → workspace '${WORKSPACE}'"
          # Safety: never destroy production
          if [ "${WORKSPACE}" = "default" ]; then
            echo "ERROR: Resolved to default workspace — aborting."
            exit 1
          fi
          echo "workspace=${WORKSPACE}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Select Terraform workspace
        working-directory: infra
        run: |
          WORKSPACE="${{ steps.workspace.outputs.workspace }}"
          if ! terraform workspace select "${WORKSPACE}" 2>/dev/null; then
            echo "Workspace '${WORKSPACE}' does not exist — nothing to destroy."
            exit 0
          fi

      # amplify_default_url is the branch-unique *.amplifyapp.com URL — the one
      # amplify-post-deploy.sh actually registers with Cognito for rc-* branches.
      # amplify_app_url is NOT used here: for rc-* it resolves to the shared
      # sudoku-beta.edoatley.co.uk domain, which every other active rc-* branch also
      # depends on and must never be removed by a single branch's teardown.
      - name: Capture branch's Amplify URL (for Cognito cleanup)
        id: branch_urls
        working-directory: infra
        continue-on-error: true
        run: |
          DEFAULT_URL=$(terraform output -raw amplify_default_url 2>/dev/null || true)
          echo "default_url=${DEFAULT_URL}" >> "$GITHUB_OUTPUT"

      # Section A of amplify-post-deploy.sh only ever adds a branch's Amplify URL to the
      # shared rc-* Cognito client; nothing removes it on teardown. This step closes that
      # gap. Best-effort: a Cognito cleanup hiccup must never block the actual resource
      # teardown below, so failures here only warn (continue-on-error).
      - name: Remove branch URL from shared rc Cognito client
        if: steps.branch_urls.outputs.default_url != ''
        working-directory: infra
        continue-on-error: true
        run: |
          terraform workspace select rc-shared
          USER_POOL_ID=$(terraform output -raw rc_shared_cognito_user_pool_id)
          CLIENT_ID=$(terraform output -raw rc_shared_cognito_web_client_id)
          terraform workspace select "${{ steps.workspace.outputs.workspace }}"

          # amplify-post-deploy.sh registers URLs with a trailing slash (BRANCH_URL="${AMPLIFY_URL}/")
          bash ../scripts/github/amplify-remove-rc-urls.sh \
            --user-pool-id "${USER_POOL_ID}" --client-id "${CLIENT_ID}" \
            --url "${{ steps.branch_urls.outputs.default_url }}/"

      - name: Terraform destroy
        working-directory: infra
        run: >-
          terraform destroy
          -auto-approve
          -input=false
          -var "github_token=${{ secrets.AMPLIFY_GITHUB_TOKEN }}"
          -var "lambda_zip_path=/dev/null"
          -var "google_client_id=placeholder"
          -var "google_client_secret=placeholder"
          -var "smoke_test_user_email=placeholder@example.com"
          -var "smoke_test_user_password=Placeholder1!"
          -var "image_recognition_image_uri=000000000000.dkr.ecr.eu-west-2.amazonaws.com/placeholder:latest"

      - name: Delete Terraform workspace
        working-directory: infra
        run: |
          terraform workspace select default
          terraform workspace delete "${{ steps.workspace.outputs.workspace }}"

      - name: Summary
        if: always()
        run: |
          echo "### RC environment torn down" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`${{ github.event.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Workspace: \`${{ steps.workspace.outputs.workspace }}\`" >> "$GITHUB_STEP_SUMMARY"
