name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ui:
    name: UI — Lint & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results
          path: ui/test-results/results.xml
          retention-days: 14

  backend:
    name: Backend — Maven Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - "4566:4566"
        env:
          SERVICES: dynamodb
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Create DynamoDB table in LocalStack
        run: |
          aws --endpoint-url=http://localhost:4566 dynamodb create-table \
            --table-name SudokuGames \
            --attribute-definitions AttributeName=gameId,AttributeType=S \
            --key-schema AttributeName=gameId,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Run unit, API and integration tests with coverage
        run: ./mvnw verify -DskipITs=false
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Upload surefire & failsafe XML reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results
          path: |
            backend/target/surefire-reports/TEST-*.xml
            backend/target/failsafe-reports/TEST-*.xml
          retention-days: 14

  security:
    name: Security — Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: UI npm audit
        working-directory: ui
        run: npm audit --audit-level=high

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Backend OWASP dependency check
        working-directory: backend
        run: ./mvnw org.owasp:dependency-check-maven:${{ env.OWASP_VERSION }}:check -DfailBuildOnCVSS=7
        env:
          OWASP_VERSION: "12.1.1"

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html
          retention-days: 14

  integration:
    name: Integration — Docker Compose + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ui, backend]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright Chromium browser
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Build and start services
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/puzzles/generate > /dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done

      - name: Run integration tests
        working-directory: ui
        run: npx playwright test --config playwright.integration.config.js
        env:
          CI: "true"

      - name: Upload integration test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-playwright-report
          path: ui/playwright-report/
          retention-days: 14

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-results
          path: ui/test-results/integration-results.xml
          retention-days: 14

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.test.yml down

  infra:
    name: Infra — Terraform fmt & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  report:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && always()
    needs: [ui, backend, integration, infra, security]
    permissions:
      pull-requests: write
    steps:
      - name: Download backend test results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: backend-test-results
          path: artifacts/backend

      - name: Download E2E test results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: e2e-results
          path: artifacts/e2e

      - name: Download integration test results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: integration-results
          path: artifacts/integration

      - name: Parse test results and post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Recursively collect all .xml files under a directory
            function collectXml(dir) {
              if (!fs.existsSync(dir)) return [];
              return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
                const full = path.join(dir, entry.name);
                return entry.isDirectory() ? collectXml(full) : (entry.name.endsWith('.xml') ? [full] : []);
              });
            }

            // Parse JUnit-style XML: sum tests/failures/errors/skipped across all files in a dir tree
            function parseJUnit(dir) {
              let tests = 0, failures = 0, errors = 0, skipped = 0;
              const files = collectXml(dir);
              if (files.length === 0) return null;
              for (const file of files) {
                const xml = fs.readFileSync(file, 'utf8');
                const suites = [...xml.matchAll(/<testsuite[^>]+>/g)];
                for (const suite of suites) {
                  tests    += parseInt(suite[0].match(/\btests="(\d+)"/)?.[1]    ?? '0');
                  failures += parseInt(suite[0].match(/\bfailures="(\d+)"/)?.[1] ?? '0');
                  errors   += parseInt(suite[0].match(/\berrors="(\d+)"/)?.[1]   ?? '0');
                  skipped  += parseInt(suite[0].match(/\bskipped="(\d+)"/)?.[1]  ?? '0');
                }
              }
              const passed = tests - failures - errors - skipped;
              return { tests, passed, failures, errors, skipped };
            }

            function fmtCounts(r) {
              if (!r) return '_no data_';
              const parts = [`${r.passed}/${r.tests} passed`];
              if (r.failures > 0) parts.push(`${r.failures} failed`);
              if (r.errors   > 0) parts.push(`${r.errors} errors`);
              if (r.skipped  > 0) parts.push(`${r.skipped} skipped`);
              return parts.join(', ');
            }

            const backend     = parseJUnit('artifacts/backend');
            const e2e         = parseJUnit('artifacts/e2e');
            const integration = parseJUnit('artifacts/integration');

            const jobResults = {
              'UI — Lint & E2E Tests':                      '${{ needs.ui.result }}',
              'Backend — Maven Tests':                       '${{ needs.backend.result }}',
              'Integration — Docker Compose + Playwright':   '${{ needs.integration.result }}',
              'Infra — Terraform fmt & validate':            '${{ needs.infra.result }}',
              'Security — Dependency Audit':                 '${{ needs.security.result }}',
            };

            const icon = (r) => r === 'success' ? '✅' : r === 'failure' ? '❌' : r === 'skipped' ? '⏭️' : '⚠️';
            const allPassed = Object.values(jobResults).every(r => r === 'success');
            const overall = allPassed ? '✅ All checks passed' : '❌ Some checks failed';

            const jobRows = Object.entries(jobResults)
              .map(([name, result]) => `| ${icon(result)} | ${name} | \`${result}\` |`)
              .join('\n');

            const testRows = [
              `| 🧪 Backend unit & integration | ${fmtCounts(backend)} |`,
              `| 🎭 UI E2E (Playwright)         | ${fmtCounts(e2e)} |`,
              `| 🔗 Full-stack integration      | ${fmtCounts(integration)} |`,
            ].join('\n');

            const body = [
              `## CI Results — ${overall}`,
              '',
              '### Jobs',
              '| | Job | Result |',
              '|---|---|---|',
              jobRows,
              '',
              '### Test counts',
              '| Suite | Results |',
              '|---|---|',
              testRows,
              '',
              `> Run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.startsWith('## CI Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
