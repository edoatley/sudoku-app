name: Integration Tests
description: Runs Docker Compose + Playwright integration tests with Docker layer caching

inputs:
  report-artifact-name:
    description: Artifact name for the Playwright HTML report (uploaded on failure)
    required: true
  upload-results:
    description: When "true", uploads the JUnit XML artifact and writes a step summary
    required: false
    default: "false"
  results-artifact-name:
    description: Artifact name for the JUnit XML results (required when upload-results is "true")
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node
      with:
        install-playwright: "true"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Cache backend Docker layers
      uses: actions/cache@v5
      with:
        path: /tmp/.buildx-cache-backend
        key: ${{ runner.os }}-buildx-backend-${{ hashFiles('backend/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-buildx-backend-

    - name: Cache UI Docker layers
      uses: actions/cache@v5
      with:
        path: /tmp/.buildx-cache-ui
        key: ${{ runner.os }}-buildx-ui-${{ hashFiles('ui/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-buildx-ui-

    - name: Pre-build backend image with cache
      uses: docker/build-push-action@v7
      with:
        context: backend
        file: backend/Dockerfile.test
        tags: sudoku-app-backend:latest
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache-backend
        cache-to: type=local,dest=/tmp/.buildx-cache-backend-new,mode=max

    - name: Pre-build UI image with cache
      uses: docker/build-push-action@v7
      with:
        context: ui
        file: ui/Dockerfile.test
        tags: sudoku-app-ui:latest
        load: true
        build-args: |
          VITE_API_URL=http://localhost:8080/api/v1
          VITE_MOCK_API=false
          VITE_SKIP_AUTH=true
        cache-from: type=local,src=/tmp/.buildx-cache-ui
        cache-to: type=local,dest=/tmp/.buildx-cache-ui-new,mode=max

    - name: Move caches
      shell: bash
      run: |
        rm -rf /tmp/.buildx-cache-backend && mv /tmp/.buildx-cache-backend-new /tmp/.buildx-cache-backend
        rm -rf /tmp/.buildx-cache-ui && mv /tmp/.buildx-cache-ui-new /tmp/.buildx-cache-ui

    - name: Start services
      shell: bash
      run: docker compose -f docker-compose.test.yml up -d --no-build

    - name: Wait for backend to be healthy
      shell: bash
      run: |
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/api/v1/puzzles/generate > /dev/null; then
            echo "Backend is ready"
            break
          fi
          echo "Waiting for backend... ($i/30)"
          sleep 3
        done

    - name: Run integration tests
      shell: bash
      working-directory: ui
      run: npx playwright test --config playwright.integration.config.js
      env:
        CI: "true"

    - name: Upload integration test report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.report-artifact-name }}
        path: ui/playwright-report/
        retention-days: 7

    - name: Upload integration test results
      if: inputs.upload-results == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.results-artifact-name }}
        path: ui/test-results/integration-results.xml
        retention-days: 7

    - name: Integration test summary
      if: inputs.upload-results == 'true'
      shell: bash
      run: |
        XML="ui/test-results/integration-results.xml"
        tests=0; failures=0; errors=0; skipped=0
        if [ -f "${XML}" ]; then
          while IFS= read -r line; do
            if [[ "${line}" =~ \<testsuite[[:space:]] ]]; then
              t=$(echo "${line}"  | grep -oP 'tests="\K[0-9]+')
              f=$(echo "${line}"  | grep -oP 'failures="\K[0-9]+')
              e=$(echo "${line}"  | grep -oP 'errors="\K[0-9]+')
              s=$(echo "${line}"  | grep -oP 'skipped="\K[0-9]+')
              tests=$((tests + ${t:-0}))
              failures=$((failures + ${f:-0}))
              errors=$((errors + ${e:-0}))
              skipped=$((skipped + ${s:-0}))
            fi
          done < "${XML}"
        fi
        passed=$((tests - failures - errors - skipped))
        icon="✅"; [ $((failures + errors)) -gt 0 ] && icon="❌"
        {
          echo "### Integration Test Results (Full-stack)"
          echo ""
          echo "| Suite | Tests | Passed | Failed | Errors |"
          echo "|-------|-------|--------|--------|--------|"
          echo "| ${icon} Full-stack (Playwright) | ${tests} | ${passed} | ${failures} | ${errors} |"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Tear down services
      if: always()
      shell: bash
      run: docker compose -f docker-compose.test.yml down
