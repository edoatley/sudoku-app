# Test root for the Python helpers that CI shells into. Mirrors infra/gcp's uv setup so there is
# one way to run Python tests in this repo, not two.
#
# Deliberately not a package: the modules here are single-file helpers invoked as scripts, and
# `pythonpath` is enough for the tests to import them.
[project]
name = "sudoku-ci-scripts"
version = "0.1.0"
description = "Python helpers invoked by GitHub Actions workflows"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
