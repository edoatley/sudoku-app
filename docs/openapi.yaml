openapi: 3.0.3
info:
  title: Serverless Sudoku API
  version: 1.0.0
  description: >
    The API contract for the Serverless Sudoku application.
    This API is completely stateless. The client is responsible for maintaining the current board state.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Quarkus Development Server
  - url: https://api.your-amplify-domain.com/v1
    description: Production AWS API Gateway
tags:
  - name: Health
    description: Health check endpoint
  - name: Puzzles
    description: Endpoints for generating and validating Sudoku grids
  - name: AI
    description: AI-backed endpoints (Amazon Bedrock). All require JWT authentication.
  - name: Games
    description: Endpoints for managing game state
  - name: Players
    description: Endpoints for player profile management
  - name: Leaderboard
    description: Endpoints for the league leaderboard
  - name: Developer
    description: Developer-only endpoints for local testing. Not exposed in production.

security:
  - CognitoJWT: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the current health status of the service.
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'


  /puzzles/generate:
    get:
      tags:
        - Puzzles
      summary: Generate a new Sudoku puzzle
      description: Returns a newly generated 9x9 Sudoku grid based on the requested difficulty.
      security: []
      parameters:
        - in: query
          name: difficulty
          schema:
            $ref: '#/components/schemas/Difficulty'
          required: false
          description: The difficulty level of the puzzle. Defaults to 'medium'.
      responses:
        '200':
          description: A new Sudoku puzzle generated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuzzleResponse'

  /puzzles/validate:
    post:
      tags:
        - Puzzles
      security: []
      summary: Validate a Sudoku board
      description: Checks the provided 9x9 grid against Sudoku rules. Returns true if valid, or a list of conflicting coordinates if invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardRequest'
      responses:
        '200':
          description: Validation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '400':
          description: Malformed board payload (e.g., not 9x9).

  /puzzles/hint:
    post:
      tags:
        - Puzzles
      security: []
      summary: Request a logical learning hint for the current board
      description: Evaluates the board using human logic techniques. Returns a progressive hint (Nudge, Focus, Reveal) and the exact board modifications required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardRequest'
      responses:
        '200':
          description: A logical hint was found successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HintResponse'
        '204':
          description: Puzzle is already solved — no hint needed.
        '404':
          description: No logical next step found (board might be invalid or requires guessing, which we want to avoid).

  /ai/coach:
    post:
      tags:
        - AI
      summary: Send a message to the AI Sudoku coach
      description: >
        Accepts the current board state and a conversation history, then returns an AI-generated
        coaching message alongside the deterministic hint for the current position.
        The coach guides novice players toward understanding the next logical move rather than
        simply disclosing it. One Bedrock call is made per request; the endpoint always returns
        200 (degrading to the hint nudge text if the AI call fails).
        Desktop only — mobile clients should not expose this endpoint in the UI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachRequest'
      responses:
        '200':
          description: Coaching response returned (AI-generated or fallback nudge text).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachResponse'
        '204':
          description: Puzzle is already solved — no technique applicable, no coaching needed.
        '400':
          description: Malformed board (not 9×9, invalid digits) or blank userMessage.
        '401':
          description: Missing or invalid Cognito JWT.

  /ai/image-to-puzzle:
    post:
      tags:
        - AI
      summary: Extract a Sudoku grid from a photo
      description: >
        Accepts a base64-encoded image of a Sudoku puzzle and returns the extracted 9×9 grid.
        Backed by the Image Recognition Lambda (Python, Bedrock Claude Haiku OCR).
        The frontend calls this first, then submits the extracted grid to POST /games/from-image
        after the user confirms the result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  description: Base64-encoded image data (JPEG or PNG).
      responses:
        '200':
          description: Grid extracted successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - originalGrid
                  - validPuzzle
                  - modelName
                properties:
                  originalGrid:
                    $ref: '#/components/schemas/Grid'
                  validPuzzle:
                    type: boolean
                    description: True if the extracted grid passes basic duplicate and clue-count checks.
                  modelName:
                    type: string
                    description: The Bedrock model that extracted the grid.
        '400':
          description: Missing or invalid image payload.
        '401':
          description: Missing or invalid Cognito JWT.
        '422':
          description: Image could not be parsed into a valid 9×9 grid.

  /ai/image-to-puzzle/warmup:
    get:
      tags:
        - AI
      security: []
      summary: Warm up the image recognition Lambda
      description: >
        Returns 200 immediately without invoking Bedrock. The frontend calls this on profile
        load to reduce cold-start latency for the first real scan. No authentication required.
      responses:
        '200':
          description: Lambda is warm.

  /puzzles/candidates:
    post:
      tags:
        - Puzzles
      security: []
      summary: Auto-calculate candidates for the board
      description: Evaluates the current board and returns a grid of all valid candidate numbers for every empty cell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardRequest'
      responses:
        '200':
          description: Candidates calculated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatesResponse'

  /games:
    post:
      tags:
        - Games
      summary: Start a new game
      description: Generates a new puzzle, creates a database record, and returns the gameId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                difficulty:
                  $ref: '#/components/schemas/Difficulty'
      responses:
        '201':
          description: Game created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'

  /games/from-image:
    post:
      tags:
        - Games
      summary: Start a new game from a scanned image grid
      description: Creates a new game using a grid extracted from an image (e.g., photographed puzzle). Returns the full game state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameFromGridRequest'
      responses:
        '201':
          description: Game created successfully from image grid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'

  /games/current:
    get:
      tags:
        - Games
      summary: Get the current in-progress game
      description: Retrieves the authenticated user's current in-progress game, if one exists.
      responses:
        '200':
          description: Current game state retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        '204':
          description: No current game in progress.

  /games/history:
    get:
      tags:
        - Games
      summary: Get the player's game history
      description: Returns a list of the authenticated user's completed games, most recent first.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
          required: false
          description: Maximum number of history entries to return. Defaults to 20, max 100.
      responses:
        '200':
          description: Game history retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameHistoryResponse'

  /games/{gameId}:
    get:
      tags:
        - Games
      summary: Load a saved game
      description: Retrieves the full game state so the user can resume.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Game state retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        '404':
          description: Game not found.

    patch:
      tags:
        - Games
      summary: Auto-save game progress
      description: Updates the current grid, notes, time spent, and hint count.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameUpdateRequest'
      responses:
        '200':
          description: Game saved successfully.

  /leaderboard:
    get:
      tags:
        - Leaderboard
      summary: Get the league leaderboard
      description: Returns the ranked leaderboard of all players with their aggregated statistics.
      responses:
        '200':
          description: Leaderboard retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'

  /players/me:
    get:
      tags:
        - Players
      summary: Get the current player's profile
      description: Returns the authenticated user's profile, including display name and account timestamps.
      responses:
        '200':
          description: Player profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
        '404':
          description: Player profile not found.

    patch:
      tags:
        - Players
      summary: Update the current player's profile
      description: Updates the authenticated user's display name and/or avatar. At least one field must be provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerUpdateRequest'
      responses:
        '200':
          description: Player profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
        '400':
          description: No valid fields provided for update.

  /dev/hint-demo:
    get:
      tags:
        - Developer
      summary: Get a demo grid for a hint technique (dev only)
      description: Returns a puzzle grid pre-configured so the named hint technique is immediately applicable. Only available locally; not routed in production.
      security: []
      parameters:
        - in: query
          name: technique
          required: true
          schema:
            type: string
          description: The markdown slug of the target strategy (e.g. "naked-pair").
      responses:
        '200':
          description: Demo puzzle grid returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuzzleResponse'
        '400':
          description: technique query parameter is missing.
        '404':
          description: Unknown technique slug.

  /dev/data/games:
    get:
      tags:
        - Developer
      summary: List all games (dev only)
      description: Returns all game records from the database as standard JSON. Only available locally against LocalStack; not routed in production.
      security: []
      responses:
        '200':
          description: All game records retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDataList'

  /dev/data/players:
    get:
      tags:
        - Developer
      summary: List all players (dev only)
      description: Returns all player profiles from the database. Only available locally against LocalStack; not routed in production.
      security: []
      responses:
        '200':
          description: All player records retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerDataList'

components:
  securitySchemes:
    CognitoJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AWS Cognito JWT access token.

  schemas:
    GameState:
      type: object
      required:
        - userId
        - gameId
        - difficulty
        - originalGrid
        - solutionGrid
        - currentGrid
        - candidates
        - timeSpentSeconds
        - status
        - hintsUsed
        - score
      properties:
        userId:
          type: string
          description: The ID of the authenticated user who owns this game.
        gameId:
          type: string
          format: uuid
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        originalGrid:
          $ref: '#/components/schemas/Grid'
        solutionGrid:
          $ref: '#/components/schemas/Grid'
          description: The complete solution to the puzzle.
        currentGrid:
          $ref: '#/components/schemas/Grid'
        candidates:
          $ref: '#/components/schemas/CandidatesGrid'
        timeSpentSeconds:
          type: integer
          description: Total time the user has actively spent on this puzzle.
        status:
          type: string
          enum: [IN_PROGRESS, SOLVED, ABANDONED]
        hintsUsed:
          type: integer
          description: Number of hints the player has requested for this game.
        score:
          type: integer
          description: Server-computed score when the game reaches SOLVED status; 0 for IN_PROGRESS and ABANDONED games.
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 UTC timestamp when the game was created. Null for games created before this field was introduced.
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 UTC timestamp when the game reached SOLVED status. Null if still in progress.
      example:
        gameId: "123e4567-e89b-12d3-a456-426614174000"
        difficulty: "medium"
        originalGrid: [[5,3,0]] # Truncated for brevity
        solutionGrid: [[5,3,4]]
        currentGrid: [[5,3,4]]
        candidates: [[[], [], [1,2]]]
        timeSpentSeconds: 145
        status: "IN_PROGRESS"
        hintsUsed: 2
        score: 0

    GameUpdateRequest:
      type: object
      required:
        - currentGrid
        - candidates
        - timeSpentSeconds
      properties:
        currentGrid:
          $ref: '#/components/schemas/Grid'
        candidates:
          $ref: '#/components/schemas/CandidatesGrid'
        timeSpentSeconds:
          type: integer
        isComplete:
          type: boolean
          description: Pass true if the user just filled the final correct square.
        hintsUsed:
          type: integer
          description: Total number of hints the player has used so far.

    GameHistoryResponse:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          description: List of completed games, most recent first.
          items:
            $ref: '#/components/schemas/GameHistoryEntry'

    GameHistoryEntry:
      type: object
      required:
        - gameId
        - difficulty
        - outcome
        - endedAt
        - elapsedSeconds
        - hintsUsed
        - score
      properties:
        gameId:
          type: string
          format: uuid
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        outcome:
          type: string
          description: How the game ended (e.g. SOLVED, ABANDONED).
        endedAt:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp when the game ended.
        elapsedSeconds:
          type: integer
          description: Total time spent on the puzzle in seconds.
        hintsUsed:
          type: integer
          description: Number of hints used during the game.
        score:
          type: integer
          description: Final score for the game.

    LeaderboardResponse:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'

    LeaderboardEntry:
      type: object
      required:
        - userId
        - displayName
        - rank
        - totalWins
        - totalGames
        - avgScore
      properties:
        userId:
          type: string
          description: Unique identifier for the player.
        displayName:
          type: string
          description: The player's display name.
        avatarKey:
          type: string
          nullable: true
          description: S3 key for the player's avatar image.
        rank:
          type: integer
          description: Player's current rank on the leaderboard.
        totalWins:
          type: integer
          description: Total number of puzzles solved.
        totalGames:
          type: integer
          description: Total number of games played.
        avgScore:
          type: integer
          description: Average score across all solved games.
        avgElapsedSeconds:
          type: integer
          nullable: true
          description: Average time to solve a puzzle in seconds. Null if no games solved.
        bestTimeByDifficulty:
          type: object
          description: Best (lowest) solve time in seconds, keyed by difficulty level.
          additionalProperties:
            type: integer

    PlayerProfile:
      type: object
      required:
        - userId
        - email
        - displayName
        - createdAt
        - updatedAt
      properties:
        userId:
          type: string
          description: Unique identifier for the player (from Cognito sub claim).
        email:
          type: string
          format: email
          description: The player's email address.
        displayName:
          type: string
          description: The player's display name.
        avatarKey:
          type: string
          nullable: true
          description: S3 key for the player's avatar image.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the player profile was created.
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the player profile was last updated.

    PlayerUpdateRequest:
      type: object
      description: At least one field must be non-null and non-blank.
      properties:
        displayName:
          type: string
          nullable: true
          description: New display name for the player.
        avatarKey:
          type: string
          nullable: true
          description: New S3 key for the player's avatar image.

    Difficulty:
      type: string
      enum: [easy, medium, hard, expert]
      default: medium
      example: "medium"

    Grid:
      type: array
      description: A 9x9 matrix representing the Sudoku board. 0 represents an empty cell.
      minItems: 9
      maxItems: 9
      items:
        type: array
        minItems: 9
        maxItems: 9
        items:
          type: integer
          minimum: 0
          maximum: 9

    PuzzleResponse:
      type: object
      required:
        - originalGrid
        - difficulty
      properties:
        originalGrid:
          $ref: '#/components/schemas/Grid'
        solutionGrid:
          $ref: '#/components/schemas/Grid'
          nullable: true
          description: The complete solution grid. Null for demo puzzles.
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        minRank:
          type: integer
          description: The minimum strategy rank used when generating this puzzle.

    BoardRequest:
      type: object
      required:
        - currentGrid
      properties:
        currentGrid:
          $ref: '#/components/schemas/Grid'
        solutionGrid:
          $ref: '#/components/schemas/Grid'
          nullable: true
          description: Optional solution grid for more precise validation.
        minRank:
          type: integer
          description: Optional minimum strategy rank to filter hints (hints below this rank are skipped).
        excludedRanks:
          type: array
          description: Optional list of strategy ranks to exclude from hint selection.
          items:
            type: integer
      example:
        currentGrid: [
          [5,3,0,0,7,0,0,0,0],
          [6,0,0,1,9,5,0,0,0],
          [0,9,8,0,0,0,0,6,0],
          [8,0,0,0,6,0,0,0,3],
          [4,0,0,8,0,3,0,0,1],
          [7,0,0,0,2,0,0,0,6],
          [0,6,0,0,0,0,2,8,0],
          [0,0,0,4,1,9,0,0,5],
          [0,0,0,0,8,0,0,7,9]
        ]

    ValidationResponse:
      type: object
      required:
        - isValid
      properties:
        isValid:
          type: boolean
          description: True if the board violates no Sudoku rules.
        isSolved:
          type: boolean
          description: True if the board is completely filled and valid.
        errors:
          type: array
          description: List of coordinates that are conflicting (if isValid is false).
          items:
            $ref: '#/components/schemas/Coordinate'

    HintResponse:
      type: object
      required:
        - techniqueName
        - markdownSlug
        - difficulty
        - strategyRank
        - nudge
        - focus
        - reveal
        - highlightCells
        - eliminatedCandidates
        - solvedCells
        - focusCandidates
      properties:
        techniqueName:
          type: string
          description: The friendly name of the logical technique used.
        markdownSlug:
          type: string
          description: The identifier linking to the frontend markdown file (e.g., "naked-pair").
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        strategyRank:
          type: integer
          description: Numeric rank of the strategy used (lower = simpler technique).
        nudge:
          type: string
          description: Level 1 Hint - A gentle push toward the technique.
        focus:
          type: string
          description: Level 2 Hint - Points the user to the specific area of the board.
        reveal:
          type: string
          description: Level 3 Hint - Explains exactly what to do and why.
        highlightCells:
          type: array
          description: Coordinates of cells that form the pattern (e.g., the two cells of a Naked Pair).
          items:
            $ref: '#/components/schemas/Coordinate'
        eliminatedCandidates:
          type: array
          description: Pencil marks that should be removed based on this logic.
          items:
            $ref: '#/components/schemas/CoordinateCandidate'
        solvedCells:
          type: array
          description: Cells that can be definitively filled based on this logic.
          items:
            $ref: '#/components/schemas/ActionableCell'
        focusCandidates:
          type: array
          description: Candidate marks to visually highlight as part of the hint focus area (without eliminating them).
          items:
            $ref: '#/components/schemas/CoordinateCandidate'
      example:
        techniqueName: "Naked Pair"
        markdownSlug: "naked-pair"
        difficulty: "medium"
        nudge: "There is a Naked Pair hiding somewhere on the board."
        focus: "Look closely at the candidates in Row 4."
        reveal: "Cells (4,2) and (4,6) only contain candidates 3 and 7. They form a Naked Pair, meaning 3 and 7 can be safely removed from all other cells in Row 4."
        highlightCells:
          - row: 4
            col: 2
          - row: 4
            col: 6
        eliminatedCandidates:
          - row: 4
            col: 8
            value: 3
          - row: 4
            col: 9
            value: 7
        solvedCells: []

    Coordinate:
      type: object
      required:
        - row
        - col
      properties:
        row:
          type: integer
          minimum: 0
          maximum: 8
        col:
          type: integer
          minimum: 0
          maximum: 8
      example:
        row: 4
        col: 2

    CandidatesResponse:
      type: object
      required:
        - candidatesGrid
      properties:
        candidatesGrid:
          $ref: '#/components/schemas/CandidatesGrid'

    CandidatesGrid:
      type: array
      description: A 9x9 matrix where each cell contains an array of possible valid integers (1-9). If a cell is already filled in the main board, its candidate array is empty.
      minItems: 9
      maxItems: 9
      items:
        type: array
        minItems: 9
        maxItems: 9
        items:
          type: array
          description: List of valid candidate numbers for this specific cell.
          items:
            type: integer
            minimum: 1
            maximum: 9

    CoordinateCandidate:
      type: object
      required:
        - row
        - col
        - value
      properties:
        row:
          type: integer
          minimum: 0
          maximum: 8
        col:
          type: integer
          minimum: 0
          maximum: 8
        value:
          type: integer
          minimum: 1
          maximum: 9
          description: The candidate number to remove.
      example:
        row: 4
        col: 8
        value: 3

    ActionableCell:
      type: object
      required:
        - row
        - col
        - value
      properties:
        row:
          type: integer
          minimum: 0
          maximum: 8
        col:
          type: integer
          minimum: 0
          maximum: 8
        value:
          type: integer
          minimum: 1
          maximum: 9
          description: The correct number to place in this cell.
      example:
        row: 2
        col: 4
        value: 7

    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          description: Health status of the service (e.g., "UP").
          example: "UP"
        service:
          type: string
          description: Name of the service.
          example: "sudoku-api"

    CreateGameFromGridRequest:
      type: object
      required:
        - originalGrid
      properties:
        originalGrid:
          $ref: '#/components/schemas/Grid'
      description: Request to create a game from a pre-existing grid (e.g., scanned from an image).

    GameDataList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: All game records from the database.
          items:
            $ref: '#/components/schemas/GameState'

    PlayerDataList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: All player records from the database.
          items:
            $ref: '#/components/schemas/PlayerProfile'

    CoachRequest:
      type: object
      required:
        - board
        - history
        - userMessage
      properties:
        board:
          $ref: '#/components/schemas/Grid'
          description: The current 9×9 board state. 0 represents an empty cell.
        history:
          type: array
          description: >
            The recent conversation turns, most recent last. The backend trims to the last 6
            messages if more are sent. The frontend is responsible for maintaining this list.
          maxItems: 6
          items:
            $ref: '#/components/schemas/ChatMessage'
        userMessage:
          type: string
          description: The player's current message to the coach. Must not be blank.
          minLength: 1
          maxLength: 500
      example:
        board:
          - [5,3,0,0,7,0,0,0,0]
          - [6,0,0,1,9,5,0,0,0]
          - [0,9,8,0,0,0,0,6,0]
          - [8,0,0,0,6,0,0,0,3]
          - [4,0,0,8,0,3,0,0,1]
          - [7,0,0,0,2,0,0,0,6]
          - [0,6,0,0,0,0,2,8,0]
          - [0,0,0,4,1,9,0,0,5]
          - [0,0,0,0,8,0,0,7,9]
        history: []
        userMessage: "I just opened the coach. Say hello briefly and let me know what you can see."

    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant]
          description: Who sent this message.
        content:
          type: string
          description: The message text.
      example:
        role: user
        content: "I'm stuck and not sure what to look at next."

    CoachResponse:
      type: object
      required:
        - aiMessage
        - hint
        - revealHint
      properties:
        aiMessage:
          type: string
          description: >
            The coaching message from the AI. If the Bedrock call fails or times out, this
            falls back to the deterministic hint nudge text.
        hint:
          $ref: '#/components/schemas/HintResponse'
          description: >
            The full deterministic hint for the current board position. Always fully populated.
            The frontend uses revealHint to decide which fields to show.
        revealHint:
          type: boolean
          description: >
            True if the AI coaching message explicitly states the solution (cell and digit).
            When false, the frontend should not show hint.reveal, hint.solvedCells, or
            hint.eliminatedCandidates. When true, the frontend may show all hint fields.
      example:
        aiMessage: "Take a look at the top-right block. How many empty cells are left in it?"
        hint:
          techniqueName: "Full House"
          markdownSlug: "full-house"
          difficulty: "easy"
          strategyRank: 10
          nudge: "One of the blocks has only one empty cell remaining."
          focus: "Look at the top-right 3×3 block — there is only one empty cell."
          reveal: "Row 1, Column 9 must be 4 — it is the only digit missing from the top-right block."
          highlightCells:
            - row: 0
              col: 8
          focusCandidates: []
          eliminatedCandidates: []
          solvedCells:
            - row: 0
              col: 8
              value: 4
        revealHint: false
