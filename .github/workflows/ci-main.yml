name: CI + Deploy (main)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci-checks.yml
    secrets: inherit

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: ci
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'openapi.yaml'
            frontend:
              - 'ui/**'

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ci, changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/build-lambda-zip
      - name: Upload Lambda zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: lambda-zip
          path: backend/target/function.zip
          retention-days: 1

  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ci, changes, build-backend]
    if: always() && !failure() && !cancelled()
    outputs:
      api_gateway_url: ${{ steps.outputs.outputs.api_gateway_url }}
      amplify_app_url: ${{ steps.outputs.outputs.amplify_app_url }}
      cognito_user_pool_id: ${{ steps.outputs.outputs.cognito_user_pool_id }}
      cognito_client_id: ${{ steps.outputs.outputs.cognito_client_id }}
      cognito_smoke_test_client_id: ${{ steps.outputs.outputs.cognito_smoke_test_client_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/configure-aws-oidc
        with:
          role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Download freshly built Lambda zip
        if: needs.changes.outputs.backend == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lambda-zip
          path: backend/target/

      - name: Download current Lambda zip from S3 (no backend changes)
        id: s3-download
        if: needs.changes.outputs.backend != 'true'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="sudoku-lambda-zip-${ACCOUNT_ID}"
          mkdir -p backend/target
          if aws s3 ls "s3://${BUCKET}/default/function.zip" > /dev/null 2>&1; then
            echo "Downloading current zip from s3://${BUCKET}/default/function.zip"
            aws s3 cp "s3://${BUCKET}/default/function.zip" backend/target/function.zip
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-java
        if: steps.s3-download.outputs.needs_build == 'true'

      - name: Build Lambda zip (S3 fallback — no prior deployment found)
        if: steps.s3-download.outputs.needs_build == 'true'
        uses: ./.github/actions/build-lambda-zip

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Select default Terraform workspace
        working-directory: infra
        run: terraform workspace select default

      - name: Terraform plan
        working-directory: infra
        run: >-
          terraform plan -out=tfplan
          -input=false
          -var "github_token=${{ secrets.AMPLIFY_GITHUB_TOKEN }}"
          -var "environment=prod"
          -var "google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}"
          -var "google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}"
          -var "smoke_test_user_email=${{ secrets.SMOKE_TEST_USER_EMAIL }}"
          -var "smoke_test_user_password=${{ secrets.SMOKE_TEST_USER_PASSWORD }}"

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve -input=false tfplan

      - name: Capture outputs
        id: outputs
        working-directory: infra
        run: |
          echo "api_gateway_url=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"
          echo "amplify_app_url=$(terraform output -raw amplify_app_url)" >> "$GITHUB_OUTPUT"
          echo "api_id=$(terraform output -raw api_gateway_api_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_smoke_test_client_id=$(terraform output -raw cognito_smoke_test_client_id)" >> "$GITHUB_OUTPUT"
          # cognito_smoke_test_client_secret is sensitive — fetched directly in smoke-test job via AWS API

      - name: Tighten CORS to exact Amplify URL
        env:
          AMPLIFY_URL: ${{ steps.outputs.outputs.amplify_app_url }}
          API_ID: ${{ steps.outputs.outputs.api_id }}
        run: |
          CORS_CONFIG=$(printf '{"AllowMethods":["GET","POST","PATCH","OPTIONS"],"AllowOrigins":["%s","http://localhost:5173"],"AllowHeaders":["Content-Type","Authorization"],"MaxAge":300}' "${AMPLIFY_URL}")
          aws apigatewayv2 update-api --api-id "${API_ID}" --cors-configuration "${CORS_CONFIG}"

      - name: Tighten Cognito callback URLs to exact Amplify URL
        env:
          AMPLIFY_URL: ${{ steps.outputs.outputs.amplify_app_url }}
          USER_POOL_ID: ${{ steps.outputs.outputs.cognito_user_pool_id }}
          CLIENT_ID: ${{ steps.outputs.outputs.cognito_client_id }}
        run: |
          aws cognito-idp update-user-pool-client \
            --user-pool-id "${USER_POOL_ID}" \
            --client-id "${CLIENT_ID}" \
            --callback-urls "${AMPLIFY_URL}/" "http://localhost:5173/" \
            --logout-urls "${AMPLIFY_URL}/" "http://localhost:5173/" \
            --supported-identity-providers "Google" \
            --allowed-o-auth-flows "code" \
            --allowed-o-auth-scopes "openid" "email" "profile" \
            --allowed-o-auth-flows-user-pool-client

      - name: Trigger Amplify build and wait
        if: needs.changes.outputs.frontend == 'true'
        working-directory: infra
        run: |
          APP_ID=$(terraform output -raw amplify_app_id)
          echo "Triggering Amplify build for branch main on app ${APP_ID}"
          JOB_ID=$(aws amplify start-job \
            --app-id "${APP_ID}" \
            --branch-name "main" \
            --job-type RELEASE \
            --query 'jobSummary.jobId' --output text)
          echo "Amplify job ID: ${JOB_ID}"

          # Wait up to 10 minutes for the build to complete
          for i in $(seq 1 40); do
            STATUS=$(aws amplify get-job \
              --app-id "${APP_ID}" \
              --branch-name "main" \
              --job-id "${JOB_ID}" \
              --query 'job.summary.status' --output text)
            echo "Attempt ${i}/40 → ${STATUS}"
            case "${STATUS}" in
              SUCCEED) echo "Amplify build succeeded"; break ;;
              FAILED|CANCELLED) echo "Amplify build ${STATUS}"; exit 1 ;;
            esac
            [ "${i}" = "40" ] && { echo "Amplify build timed out"; exit 1; }
            sleep 15
          done

      - name: Print deployment URLs
        working-directory: infra
        run: terraform output

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    outputs:
      api_smoke_result: ${{ steps.api-smoke.outcome }}
      playwright_result: ${{ steps.playwright.outcome }}
    steps:
      - uses: actions/checkout@v6

      - name: API smoke tests
        id: api-smoke
        env:
          API_URL: ${{ needs.deploy.outputs.api_gateway_url }}
        run: |
          # Strip trailing slash to avoid double-slash URLs (API Gateway invoke URL ends with /)
          API_BASE="${API_URL%/}"
          echo "Testing API Gateway: ${API_BASE}"

          SUMMARY=""
          FAILED=0

          check() {
            local label="$1" status="$2" expected="$3" extra="$4"
            if [ "${status}" = "${expected}" ] && { [ -z "${extra}" ] || eval "${extra}"; }; then
              SUMMARY="${SUMMARY}\n| ${label} | ✅ ${status} |"
            else
              SUMMARY="${SUMMARY}\n| ${label} | ❌ ${status} (expected ${expected}) |"
              FAILED=1
            fi
          }

          # /health
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "${API_BASE}/api/v1/health")
          check "GET /api/v1/health" "${STATUS}" "200" "grep -q '\"status\"' /tmp/health.json"

          # /puzzles/generate
          STATUS=$(curl -s -o /tmp/generate.json -w "%{http_code}" "${API_BASE}/api/v1/puzzles/generate")
          check "GET /api/v1/puzzles/generate" "${STATUS}" "200" "grep -q '\"originalGrid\"' /tmp/generate.json"

          # /puzzles/generate?difficulty=hard
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_BASE}/api/v1/puzzles/generate?difficulty=hard")
          check "GET /api/v1/puzzles/generate?difficulty=hard" "${STATUS}" "200"

          # POST /games without token — JWT authorizer must reject with 401
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${API_BASE}/api/v1/games" \
            -H "Content-Type: application/json" -d '{"difficulty":"easy"}')
          check "POST /api/v1/games (no token → 401)" "${STATUS}" "401"

          {
            echo "### API Smoke Tests"
            echo ""
            echo "| Endpoint | Result |"
            echo "|----------|--------|"
            printf "%b\n" "${SUMMARY}"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "${FAILED}" = "0" ] || { echo "One or more API smoke tests failed"; exit 1; }

      - name: Wait for Amplify deployment to complete
        env:
          APP_URL: ${{ needs.deploy.outputs.amplify_app_url }}
        run: |
          echo "Waiting for Amplify app to be reachable at ${APP_URL}"
          for i in $(seq 1 20); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${APP_URL}" || echo "000")
            echo "Attempt ${i}/20 → HTTP ${STATUS}"
            [ "${STATUS}" = "200" ] && { echo "Amplify ready"; break; }
            [ "${i}" = "20" ] && { echo "FAIL: Amplify not ready after 60s"; exit 1; }
            sleep 15
          done

      - uses: ./.github/actions/configure-aws-oidc
        with:
          role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Acquire Cognito ID token for smoke test user
        id: get-token
        env:
          USER_POOL_ID: ${{ needs.deploy.outputs.cognito_user_pool_id }}
          # Use the public web client (no secret) so the token audience matches what
          # Amplify expects in the browser — the smoke client's aud would mismatch.
          CLIENT_ID: ${{ needs.deploy.outputs.cognito_client_id }}
          USERNAME: ${{ secrets.SMOKE_TEST_USER_EMAIL }}
          PASSWORD: ${{ secrets.SMOKE_TEST_USER_PASSWORD }}
        run: |
          # The web client has no secret, so no SECRET_HASH is required.
          AUTH_PARAMS=$(jq -n \
            --arg u "${USERNAME}" \
            --arg p "${PASSWORD}" \
            '{"USERNAME": $u, "PASSWORD": $p}')
          RESPONSE=$(aws cognito-idp initiate-auth \
            --auth-flow USER_PASSWORD_AUTH \
            --client-id "${CLIENT_ID}" \
            --auth-parameters "${AUTH_PARAMS}" \
            --output json)

          ID_TOKEN=$(echo "${RESPONSE}" | jq -r '.AuthenticationResult.IdToken')
          ACCESS_TOKEN=$(echo "${RESPONSE}" | jq -r '.AuthenticationResult.AccessToken')

          # Mask both tokens so they never appear in logs
          echo "::add-mask::${ID_TOKEN}"
          echo "::add-mask::${ACCESS_TOKEN}"

          echo "SMOKE_ID_TOKEN=${ID_TOKEN}"     >> "$GITHUB_ENV"
          echo "SMOKE_ACCESS_TOKEN=${ACCESS_TOKEN}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-node
        with:
          install-playwright: "true"

      - name: Run Playwright integration tests against Amplify
        id: playwright
        working-directory: ui
        env:
          CI: "true"
          INTEGRATION_BASE_URL: ${{ needs.deploy.outputs.amplify_app_url }}
          COGNITO_USER_POOL_ID: ${{ needs.deploy.outputs.cognito_user_pool_id }}
          COGNITO_CLIENT_ID: ${{ needs.deploy.outputs.cognito_client_id }}
          SMOKE_ID_TOKEN: ${{ env.SMOKE_ID_TOKEN }}
          SMOKE_ACCESS_TOKEN: ${{ env.SMOKE_ACCESS_TOKEN }}
        run: npx playwright test --config playwright.integration.config.js

      - name: Upload Playwright integration report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-playwright-report
          path: ui/playwright-report/
          retention-days: 14

      - name: Upload Playwright integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-integration-results
          path: ui/test-results/integration-results.xml
          retention-days: 14

      - name: Smoke test summary
        if: always()
        env:
          API_RESULT: ${{ steps.api-smoke.outcome }}
          PLAYWRIGHT_RESULT: ${{ steps.playwright.outcome }}
        run: |
          {
            echo ""
            echo "### Smoke Test Summary"
            echo ""
            echo "| Suite | Result |"
            echo "|-------|--------|"
            case "${API_RESULT}" in
              success) echo "| API smoke tests | ✅ passed |" ;;
              failure) echo "| API smoke tests | ❌ failed |" ;;
              skipped) echo "| API smoke tests | ⏭️ skipped |" ;;
              *)       echo "| API smoke tests | ❓ ${API_RESULT} |" ;;
            esac
            case "${PLAYWRIGHT_RESULT}" in
              success) echo "| Playwright UI tests | ✅ passed |" ;;
              failure) echo "| Playwright UI tests | ❌ failed |" ;;
              skipped) echo "| Playwright UI tests | ⏭️ skipped |" ;;
              *)       echo "| Playwright UI tests | ❓ ${PLAYWRIGHT_RESULT} |" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy, smoke-test]
    if: always()
    steps:
      - name: Deployment summary
        env:
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          SMOKE_STATUS: ${{ needs.smoke-test.result }}
          API_URL: ${{ needs.deploy.outputs.api_gateway_url }}
          APP_URL: ${{ needs.deploy.outputs.amplify_app_url }}
        run: |
          if [ "${DEPLOY_STATUS}" = "success" ]; then
            echo "### Deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Resource | URL |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-----|" >> "$GITHUB_STEP_SUMMARY"
            echo "| API Gateway | ${API_URL} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Amplify App | ${APP_URL} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deployment failed (status: ${DEPLOY_STATUS})" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the deploy job logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${SMOKE_STATUS}" = "success" ]; then
            echo "### Smoke tests passed ✅" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${SMOKE_STATUS}" = "skipped" ]; then
            echo "### Smoke tests skipped ⏭️" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Smoke tests failed ❌ (status: ${SMOKE_STATUS})" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the smoke-test job logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Delete lambda-zip artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[] | select(.name == "lambda-zip") | .id' | xargs -I{} gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/{}
