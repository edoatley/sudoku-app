name: CI + Deploy

on:
  push:
    branches:
      - main
      - "rc-*"

# One deploy per branch at a time. A new push cancels the in-flight run for
# that branch so Terraform state locks don't pile up across concurrent runs.
concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  gate-ui:
    name: UI — Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - name: Lint
        run: npm run lint
      - name: Unit tests with coverage
        run: npm run test:coverage

  gate-backend:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java
      - name: Run unit and API tests with coverage
        run: ./mvnw -B -ntp verify -T 1C

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate-ui, gate-backend]
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'openapi.yaml'
            frontend:
              - 'ui/**'

  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate-ui, gate-backend, changes]
    if: needs.changes.outputs.backend == 'true'
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/configure-aws-oidc
        with:
          role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - uses: ./.github/actions/setup-java

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        id: build
        uses: ./.github/actions/build-backend-image
        with:
          registry: ${{ steps.ecr-login.outputs.registry }}

  build-image-recognition:
    name: Build Image Recognition Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate-ui, gate-backend]
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/configure-aws-oidc
        with:
          role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image recognition image
        id: push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: sudoku-image-recognition
          SHA: ${{ github.sha }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "${BRANCH}" = "main" ]; then
            TAG_PREFIX="main"
          else
            TAG_PREFIX=$(echo "${BRANCH}" | tr '/' '-' | tr '.' '-' | cut -c1-32)
          fi
          IMAGE_URI="${REGISTRY}/${REPO}:${TAG_PREFIX}-sha-${SHA}"
          docker build -t "${IMAGE_URI}" -t "${REGISTRY}/${REPO}:${TAG_PREFIX}-latest" image_recognition/
          docker push "${IMAGE_URI}"
          docker push "${REGISTRY}/${REPO}:${TAG_PREFIX}-latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [gate-ui, gate-backend, changes, build-backend, build-image-recognition]
    if: always() && !failure() && !cancelled()
    outputs:
      api_gateway_url: ${{ steps.outputs.outputs.api_gateway_url }}
      amplify_app_url: ${{ steps.outputs.outputs.amplify_app_url }}
      amplify_default_url: ${{ steps.outputs.outputs.amplify_default_url }}
      cognito_user_pool_id: ${{ steps.outputs.outputs.cognito_user_pool_id }}
      cognito_client_id: ${{ steps.outputs.outputs.cognito_client_id }}
      is_main: ${{ steps.env.outputs.is_main }}
      workspace: ${{ steps.env.outputs.workspace }}
      branch: ${{ steps.env.outputs.branch }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve environment
        id: env
        run: bash scripts/github/resolve-environment.sh

      - uses: ./.github/actions/configure-aws-oidc
        with:
          role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Resolve backend image URI (no backend changes — reuse currently deployed image)
        id: current-image
        if: needs.changes.outputs.backend != 'true'
        run: |
          WORKSPACE="${{ steps.env.outputs.workspace }}"
          FUNC_NAME="sudoku$([ "${WORKSPACE}" = "default" ] && echo "" || echo "-${WORKSPACE}")"
          URI=$(aws lambda get-function --function-name "${FUNC_NAME}" --query 'Code.ImageUri' --output text 2>/dev/null || echo "")
          if [ -n "${URI}" ] && [ "${URI}" != "None" ]; then
            echo "Reusing currently deployed image: ${URI}"
            echo "image_uri=${URI}" >> "$GITHUB_OUTPUT"
          else
            echo "No deployed image found — will build fresh."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-java
        if: steps.current-image.outputs.needs_build == 'true'

      - name: Log in to ECR (fallback build)
        id: ecr-login-fallback
        if: steps.current-image.outputs.needs_build == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image (fallback — no prior deployment found)
        id: fallback-build
        if: steps.current-image.outputs.needs_build == 'true'
        uses: ./.github/actions/build-backend-image
        with:
          registry: ${{ steps.ecr-login-fallback.outputs.registry }}

      - name: Resolve final backend image URI
        id: backend-image
        run: |
          if [ -n "${{ steps.fallback-build.outputs.image_uri }}" ]; then
            URI="${{ steps.fallback-build.outputs.image_uri }}"
          elif [ -n "${{ steps.current-image.outputs.image_uri }}" ]; then
            URI="${{ steps.current-image.outputs.image_uri }}"
          else
            URI="${{ needs.build-backend.outputs.image_uri }}"
          fi
          echo "image_uri=${URI}" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        working-directory: infra/aws
        run: terraform init

      - name: Select or create Terraform workspace
        working-directory: infra/aws
        run: terraform workspace select -or-create "${{ steps.env.outputs.workspace }}"

      - name: Write RC-specific Terraform var file
        if: steps.env.outputs.is_main == 'false'
        working-directory: infra/aws
        env:
          RC_WEB_CLIENT_ID:   ${{ secrets.RC_COGNITO_WEB_CLIENT_ID }}
          RC_SMOKE_CLIENT_ID: ${{ secrets.RC_COGNITO_SMOKE_CLIENT_ID }}
        run: |
          cat > rc-override.tfvars <<EOF
          rc_cognito_web_client_id   = "${RC_WEB_CLIENT_ID}"
          rc_cognito_smoke_client_id = "${RC_SMOKE_CLIENT_ID}"
          EOF

      - name: Release beta domain from previous RC app
        if: steps.env.outputs.is_main == 'false'
        run: bash scripts/github/amplify-pre-deploy.sh

      - name: Terraform plan
        env:
          TF_VAR_github_token:             ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
          TF_VAR_google_client_id:         ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret:     ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_smoke_test_user_email:    ${{ secrets.SMOKE_TEST_USER_EMAIL }}
          TF_VAR_smoke_test_user_password: ${{ secrets.SMOKE_TEST_USER_PASSWORD }}
          TF_VAR_image_recognition_image_uri: ${{ needs.build-image-recognition.outputs.image_uri }}
          TF_VAR_backend_image_uri:         ${{ steps.backend-image.outputs.image_uri }}
          TF_VAR_git_branch:               ${{ steps.env.outputs.amplify_branch }}
          TF_VAR_budget_alert_email:       ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: |
          bash scripts/github/terraform-plan.sh \
            --is-main     "${{ steps.env.outputs.is_main }}" \
            --out         tfplan \
            $( [ "${{ steps.env.outputs.is_main }}" = "false" ] && echo '--rc-vars-file rc-override.tfvars' )

      - name: Terraform apply
        working-directory: infra/aws
        run: terraform apply -auto-approve -input=false tfplan

      - name: Print Route53 NS records
        if: steps.env.outputs.is_main == 'true'
        working-directory: infra/aws
        run: |
          if terraform output -json subdomain_nameservers | jq -e 'length > 0' > /dev/null 2>&1; then
            echo "========================================================"
            echo "  Route53 NS records for sudoku.edoatley.co.uk"
            echo "  Run scripts/infra/shared/delegate-dns.sh with these values:"
            echo "========================================================"
            terraform output -json subdomain_nameservers | jq -r '.[]'
            echo "========================================================"
          fi

      - name: Capture outputs
        id: outputs
        working-directory: infra/aws
        run: |
          echo "api_gateway_url=$(terraform output -raw api_gateway_url)"             >> "$GITHUB_OUTPUT"
          echo "amplify_app_url=$(terraform output -raw amplify_app_url)"             >> "$GITHUB_OUTPUT"
          echo "amplify_default_url=$(terraform output -raw amplify_default_url)"     >> "$GITHUB_OUTPUT"
          echo "api_id=$(terraform output -raw api_gateway_api_id)"                   >> "$GITHUB_OUTPUT"
          echo "amplify_app_id=$(terraform output -raw amplify_app_id)"               >> "$GITHUB_OUTPUT"
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)"   >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)"         >> "$GITHUB_OUTPUT"
          echo "cognito_smoke_test_client_id=$(terraform output -raw cognito_smoke_test_client_id)" >> "$GITHUB_OUTPUT"

      - name: Post-deploy configuration
        env:
          AMPLIFY_URL:      ${{ steps.outputs.outputs.amplify_app_url }}
          DEFAULT_URL:      ${{ steps.outputs.outputs.amplify_default_url }}
          API_ID:           ${{ steps.outputs.outputs.api_id }}
          APP_ID:           ${{ steps.outputs.outputs.amplify_app_id }}
          USER_POOL_ID:     ${{ steps.outputs.outputs.cognito_user_pool_id }}
          CLIENT_ID:        ${{ steps.outputs.outputs.cognito_client_id }}
          BRANCH:           ${{ steps.env.outputs.amplify_branch }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          IS_MAIN:          ${{ steps.env.outputs.is_main }}
        run: |
          MODE="$( [ "${IS_MAIN}" = "true" ] && echo prod || echo rc )"
          bash scripts/github/amplify-post-deploy.sh \
            --mode            "${MODE}" \
            --api-id          "${API_ID}" \
            --app-id          "${APP_ID}" \
            --amplify-url     "${AMPLIFY_URL}" \
            --default-url     "${DEFAULT_URL}" \
            --branch          "${BRANCH}" \
            --user-pool-id    "${USER_POOL_ID}" \
            --client-id       "${CLIENT_ID}" \
            --frontend-changed "${FRONTEND_CHANGED}"

      - name: Print deployment URLs
        working-directory: infra/aws
        run: terraform output

  smoke-test:
    name: Smoke Tests
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    uses: ./.github/workflows/smoke-tests.yml
    secrets: inherit
    with:
      api_gateway_url: ${{ needs.deploy.outputs.api_gateway_url }}
      amplify_app_url: ${{ needs.deploy.outputs.amplify_app_url }}
      amplify_default_url: ${{ needs.deploy.outputs.amplify_default_url }}
      cognito_user_pool_id: ${{ needs.deploy.outputs.cognito_user_pool_id }}
      cognito_client_id: ${{ needs.deploy.outputs.is_main == 'true' && needs.deploy.outputs.cognito_client_id || '' }}
      environment_type: ${{ needs.deploy.outputs.is_main == 'true' && 'main' || 'rc' }}
      workspace: ${{ needs.deploy.outputs.workspace }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy, smoke-test]
    if: always()
    steps:
      - name: Deployment summary
        env:
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          SMOKE_STATUS:  ${{ needs.smoke-test.result }}
          API_URL:       ${{ needs.deploy.outputs.api_gateway_url }}
          APP_URL:       ${{ needs.deploy.outputs.amplify_app_url }}
          DEFAULT_URL:   ${{ needs.deploy.outputs.amplify_default_url }}
          USER_POOL_ID:  ${{ needs.deploy.outputs.cognito_user_pool_id }}
          CLIENT_ID:     ${{ needs.deploy.outputs.cognito_client_id }}
          IS_MAIN:       ${{ needs.deploy.outputs.is_main }}
          ENV_TYPE:      ${{ needs.deploy.outputs.is_main == 'true' && 'main' || 'rc' }}
        run: |
          if [ "${DEPLOY_STATUS}" = "success" ]; then
            echo "### Deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Resource | URL |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-----|" >> "$GITHUB_STEP_SUMMARY"
            echo "| API Gateway | ${API_URL} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Amplify App | ${APP_URL} |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Re-run smoke tests manually" >> "$GITHUB_STEP_SUMMARY"
            echo "Use these values in the [Smoke Tests](../actions/workflows/smoke-tests.yml) \`workflow_dispatch\`:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Input | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`api_gateway_url\` | \`${API_URL}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`amplify_app_url\` | \`${APP_URL}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`amplify_default_url\` | \`${DEFAULT_URL}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`cognito_user_pool_id\` | \`${USER_POOL_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
            if [ "${IS_MAIN}" = "true" ]; then
              echo "| \`cognito_client_id\` | \`${CLIENT_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`cognito_client_id\` | *(leave blank — resolved automatically)* |" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "| \`environment_type\` | \`${ENV_TYPE}\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deployment failed (status: ${DEPLOY_STATUS})" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the deploy job logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${SMOKE_STATUS}" = "success" ]; then
            echo "### Smoke tests passed ✅" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${SMOKE_STATUS}" = "skipped" ]; then
            echo "### Smoke tests skipped ⏭️" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Smoke tests failed ❌ (status: ${SMOKE_STATUS})" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the smoke-test job logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi
