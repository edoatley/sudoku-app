name: Setup Node
description: Install Node, npm dependencies, and optionally Playwright

inputs:
  install-playwright:
    description: Whether to install Playwright Chromium
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: ui/package-lock.json

    - name: Install UI dependencies
      shell: bash
      working-directory: ui
      run: npm ci || npm install

    - name: Cache Playwright browsers
      id: playwright-cache
      if: inputs.install-playwright == 'true'
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}

    - name: Install Playwright Chromium browser
      if: inputs.install-playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ui
      run: npx playwright install --with-deps chromium

    - name: Install Playwright system dependencies only
      if: inputs.install-playwright == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ui
      run: npx playwright install-deps chromium
