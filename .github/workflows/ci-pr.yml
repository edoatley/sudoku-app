name: CI (PR)

on:
  pull_request:
    branches: ["**"]

jobs:
  ui:
    name: UI — Lint, Unit Tests & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
        with:
          install-playwright: "true"
      - name: Lint
        run: npm run lint
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-unit-results
          path: ui/test-results/unit-results.xml
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-coverage
          path: ui/coverage/coverage-summary.json
          retention-days: 14
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14
      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: ui/test-results/results.xml
          retention-days: 14

  backend:
    name: Backend — Maven Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - "4566:4566"
        env:
          SERVICES: dynamodb
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/create-localstack-dynamodb
      - name: Run unit, API and integration tests with coverage
        run: ./mvnw verify -DskipITs=false
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14
      - name: Upload surefire & failsafe XML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            backend/target/surefire-reports/TEST-*.xml
            backend/target/failsafe-reports/TEST-*.xml
          retention-days: 14

  security:
    name: Security — Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - name: UI npm audit
        working-directory: ui
        run: npm audit --audit-level=high
      - uses: ./.github/actions/setup-java
      - name: Compute OWASP cache week key
        id: owasp-week
        run: echo "week=$(date -u +'%Y-%U')" >> "$GITHUB_OUTPUT"
      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ steps.owasp-week.outputs.week }}
          restore-keys: |
            owasp-nvd-
      - name: Backend OWASP dependency check
        working-directory: backend
        run: >-
          ./mvnw org.owasp:dependency-check-maven:${{ env.OWASP_VERSION }}:check
          -DfailBuildOnCVSS=7
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
          -DdataDirectory="${HOME}/.m2/repository/org/owasp/dependency-check-data"
        env:
          OWASP_VERSION: "12.1.1"
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html
          retention-days: 14

  integration:
    name: Integration — Docker Compose + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ui, backend]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
        with:
          install-playwright: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache backend Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-backend
          key: ${{ runner.os }}-buildx-backend-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-backend-
      - name: Cache UI Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-ui
          key: ${{ runner.os }}-buildx-ui-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-buildx-ui-
      - name: Pre-build backend image with cache
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.test
          tags: sudoku-app-backend:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache-backend
          cache-to: type=local,dest=/tmp/.buildx-cache-backend-new,mode=max
      - name: Pre-build UI image with cache
        uses: docker/build-push-action@v6
        with:
          context: ui
          file: ui/Dockerfile.test
          tags: sudoku-app-ui:latest
          load: true
          build-args: |
            VITE_API_URL=http://localhost:8080/api/v1
            VITE_MOCK_API=false
            VITE_SKIP_AUTH=true
          cache-from: type=local,src=/tmp/.buildx-cache-ui
          cache-to: type=local,dest=/tmp/.buildx-cache-ui-new,mode=max
      - name: Move caches
        run: |
          rm -rf /tmp/.buildx-cache-backend && mv /tmp/.buildx-cache-backend-new /tmp/.buildx-cache-backend
          rm -rf /tmp/.buildx-cache-ui && mv /tmp/.buildx-cache-ui-new /tmp/.buildx-cache-ui
      - name: Start services
        run: docker compose -f docker-compose.test.yml up -d --no-build
      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/puzzles/generate > /dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done
      - name: Run integration tests
        working-directory: ui
        run: npx playwright test --config playwright.integration.config.js
        env:
          CI: "true"
      - name: Upload integration test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-playwright-report
          path: ui/playwright-report/
          retention-days: 14
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: ui/test-results/integration-results.xml
          retention-days: 14
      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.test.yml down

  infra:
    name: Infra — Terraform fmt & validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - uses: ./.github/actions/terraform-validate

  report:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [ui, backend, integration, infra, security]
    permissions:
      pull-requests: write
    steps:
      - name: Download backend test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: backend-test-results
          path: artifacts/backend

      - name: Download JaCoCo coverage report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: jacoco-report
          path: artifacts/jacoco

      - name: Download UI unit test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ui-unit-results
          path: artifacts/ui-unit

      - name: Download UI coverage summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ui-coverage
          path: artifacts/ui-coverage

      - name: Download E2E test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-results
          path: artifacts/e2e

      - name: Download integration test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: integration-results
          path: artifacts/integration

      - name: Parse test results and post PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function collectXml(dir) {
              if (!fs.existsSync(dir)) return [];
              return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
                const full = path.join(dir, entry.name);
                return entry.isDirectory() ? collectXml(full) : (entry.name.endsWith('.xml') ? [full] : []);
              });
            }

            function parseJUnit(dir) {
              let tests = 0, failures = 0, errors = 0, skipped = 0;
              const files = collectXml(dir);
              if (files.length === 0) return null;
              for (const file of files) {
                const xml = fs.readFileSync(file, 'utf8');
                const suites = [...xml.matchAll(/<testsuite[^>]+>/g)];
                for (const suite of suites) {
                  tests    += parseInt(suite[0].match(/\btests="(\d+)"/)?.[1]    ?? '0');
                  failures += parseInt(suite[0].match(/\bfailures="(\d+)"/)?.[1] ?? '0');
                  errors   += parseInt(suite[0].match(/\berrors="(\d+)"/)?.[1]   ?? '0');
                  skipped  += parseInt(suite[0].match(/\bskipped="(\d+)"/)?.[1]  ?? '0');
                }
              }
              const passed = tests - failures - errors - skipped;
              return { tests, passed, failures, errors, skipped };
            }

            function fmtCounts(r) {
              if (!r) return '_no data_';
              const parts = [`${r.passed}/${r.tests} passed`];
              if (r.failures > 0) parts.push(`${r.failures} failed`);
              if (r.errors   > 0) parts.push(`${r.errors} errors`);
              if (r.skipped  > 0) parts.push(`${r.skipped} skipped`);
              return parts.join(', ');
            }

            // --- Parse JaCoCo XML for backend line coverage ---
            function parseJaCoCo(dir) {
              const xmlPath = path.join(dir, 'jacoco.xml');
              if (!fs.existsSync(xmlPath)) return null;
              const xml = fs.readFileSync(xmlPath, 'utf8');
              const m = xml.match(/<counter type="LINE" missed="(\d+)" covered="(\d+)"/);
              if (!m) return null;
              const missed  = parseInt(m[1]);
              const covered = parseInt(m[2]);
              const total   = missed + covered;
              return total > 0 ? ((covered / total) * 100).toFixed(1) : '0.0';
            }

            // --- Parse Vitest coverage-summary.json ---
            function parseVitestCoverage(dir) {
              const summaryPath = path.join(dir, 'coverage-summary.json');
              if (!fs.existsSync(summaryPath)) return null;
              try {
                const data = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
                const t = data.total;
                if (!t) return null;
                return {
                  lines: t.lines?.pct ?? null,
                  statements: t.statements?.pct ?? null,
                  functions: t.functions?.pct ?? null,
                };
              } catch { return null; }
            }

            const backend     = parseJUnit('artifacts/backend');
            const unitTests   = parseJUnit('artifacts/ui-unit');
            const e2e         = parseJUnit('artifacts/e2e');
            const integration = parseJUnit('artifacts/integration');

            const backendCovPct  = parseJaCoCo('artifacts/jacoco');
            const uiCov          = parseVitestCoverage('artifacts/ui-coverage');

            const jobResults = {
              'UI — Lint, Unit Tests & E2E':               '${{ needs.ui.result }}',
              'Backend — Maven Tests':                      '${{ needs.backend.result }}',
              'Integration — Docker Compose + Playwright':  '${{ needs.integration.result }}',
              'Infra — Terraform fmt & validate':           '${{ needs.infra.result }}',
              'Security — Dependency Audit':                '${{ needs.security.result }}',
            };

            const icon = (r) => r === 'success' ? '✅' : r === 'failure' ? '❌' : r === 'skipped' ? '⏭️' : '⚠️';
            const allPassed = Object.values(jobResults).every(r => r === 'success');
            const overall = allPassed ? '✅ All checks passed' : '❌ Some checks failed';

            const jobRows = Object.entries(jobResults)
              .map(([name, result]) => `| ${icon(result)} | ${name} | \`${result}\` |`)
              .join('\n');

            // Coverage column: show % or dash if not available
            const backendCovStr = backendCovPct  ? `${backendCovPct}% line` : '_n/a_';
            const uiCovStr      = uiCov?.lines   ? `${uiCov.lines}% line`  : '_n/a_';

            const testRows = [
              `| 🧪 Backend unit & API tests | ${fmtCounts(backend)}   | ${backendCovStr} |`,
              `| 🔬 UI unit tests (Vitest)    | ${fmtCounts(unitTests)} | ${uiCovStr} |`,
              `| 🎭 UI E2E (Playwright)        | ${fmtCounts(e2e)}       | _n/a_ |`,
              `| 🔗 Full-stack integration     | ${fmtCounts(integration)} | _n/a_ |`,
            ].join('\n');

            const body = [
              `## CI Results — ${overall}`,
              '',
              '### Jobs',
              '| | Job | Result |',
              '|---|---|---|',
              jobRows,
              '',
              '### Test counts & coverage',
              '| Suite | Results | Coverage |',
              '|---|---|---|',
              testRows,
              '',
              `> Run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.startsWith('## CI Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
