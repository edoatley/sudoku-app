services:
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  localstack-setup:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command:
      - --endpoint-url=http://localstack:4566
      - dynamodb
      - create-table
      - --table-name=SudokuGames
      - --attribute-definitions=AttributeName=gameId,AttributeType=S
      - --key-schema=AttributeName=gameId,KeyType=HASH
      - --billing-mode=PAY_PER_REQUEST
    depends_on:
      localstack:
        condition: service_healthy

  backend:
    build:
      context: backend
      dockerfile: Dockerfile.test
    ports:
      - "8080:8080"
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:5174,http://ui:5174"
      QUARKUS_DYNAMODB_ENDPOINT_OVERRIDE: "http://localstack:4566"
      QUARKUS_DYNAMODB_AWS_REGION: "us-east-1"
      QUARKUS_DYNAMODB_AWS_CREDENTIALS_TYPE: "static"
      QUARKUS_DYNAMODB_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: "test"
      QUARKUS_DYNAMODB_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: "test"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/api/v1/puzzles/generate || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
    depends_on:
      localstack-setup:
        condition: service_completed_successfully

  ui:
    build:
      context: ui
      dockerfile: Dockerfile.test
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: "http://localhost:8080/api/v1"
      VITE_MOCK_API: "false"
    depends_on:
      backend:
        condition: service_healthy
