name: Create LocalStack DynamoDB Table
description: Creates the SudokuGames DynamoDB table in a running LocalStack instance

runs:
  using: composite
  steps:
    - name: Create DynamoDB table in LocalStack
      shell: bash
      run: |
        aws --endpoint-url=http://localhost:4566 dynamodb create-table \
          --table-name SudokuGames \
          --attribute-definitions AttributeName=gameId,AttributeType=S \
          --key-schema AttributeName=gameId,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --region us-east-1
      env:
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        AWS_DEFAULT_REGION: us-east-1
