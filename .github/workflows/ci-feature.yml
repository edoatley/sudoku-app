name: CI (feature branches)

on:
  push:
    branches:
      - "**"
      - "!main"
      - "!rc-*"

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci-checks.yml
    secrets: inherit

  integration:
    name: Integration — Docker Compose + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/integration-tests
        with:
          report-artifact-name: push-integration-playwright-report
          upload-results: "true"
          results-artifact-name: push-integration-results
