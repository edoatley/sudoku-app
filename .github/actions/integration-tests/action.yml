name: Integration Tests
description: Runs integration tests using native quarkus:dev + npm dev servers (no Docker)

inputs:
  report-artifact-name:
    description: Artifact name for the Playwright HTML report (uploaded on failure)
    required: true
  upload-results:
    description: When "true", uploads the JUnit XML artifact and writes a step summary
    required: false
    default: "false"
  results-artifact-name:
    description: Artifact name for the JUnit XML results (required when upload-results is "true")
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node
      with:
        install-playwright: "true"

    - uses: ./.github/actions/setup-java

    - uses: ./.github/actions/create-localstack-dynamodb

    - name: Start backend (quarkus:dev)
      shell: bash
      working-directory: backend
      env:
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        AWS_DEFAULT_REGION: us-east-1
        CORS_ALLOWED_ORIGINS: http://localhost:5174
      run: |
        ./mvnw quarkus:dev \
          -Dquarkus.http.host=0.0.0.0 \
          -Ddebug=false \
          -Dquarkus.console.color=false \
          > /tmp/quarkus-dev.log 2>&1 &
        echo "QUARKUS_PID=$!" >> "$GITHUB_ENV"

    - name: Wait for backend to be ready
      shell: bash
      run: |
        for i in $(seq 1 40); do
          if curl -sf http://localhost:8080/api/v1/puzzles/generate > /dev/null 2>&1; then
            echo "Backend ready after ${i} attempts"
            exit 0
          fi
          echo "Waiting for backend... (${i}/40)"
          sleep 3
        done
        echo "Backend failed to start — logs:"
        cat /tmp/quarkus-dev.log
        exit 1

    - name: Start UI dev server
      shell: bash
      working-directory: ui
      env:
        VITE_API_URL: http://localhost:8080/api/v1
        VITE_MOCK_API: "false"
        VITE_SKIP_AUTH: "true"
        VITE_DEV_TOOLS: "true"
      run: |
        npm run dev -- --port 5174 > /tmp/vite-dev.log 2>&1 &
        echo "VITE_PID=$!" >> "$GITHUB_ENV"

    - name: Wait for UI dev server to be ready
      shell: bash
      run: |
        for i in $(seq 1 20); do
          if curl -sf http://localhost:5174 > /dev/null 2>&1; then
            echo "UI ready after ${i} attempts"
            exit 0
          fi
          echo "Waiting for UI... (${i}/20)"
          sleep 2
        done
        echo "UI failed to start — logs:"
        cat /tmp/vite-dev.log
        exit 1

    - name: Run integration tests
      shell: bash
      working-directory: ui
      env:
        CI: "true"
      run: npx playwright test --config playwright.integration.config.js

    - name: Upload integration test report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.report-artifact-name }}
        path: ui/playwright-report/
        retention-days: 7

    - name: Upload integration test results
      if: inputs.upload-results == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.results-artifact-name }}
        path: ui/test-results/integration-results.xml
        retention-days: 7

    - name: Integration test summary
      if: inputs.upload-results == 'true'
      shell: bash
      run: |
        XML="ui/test-results/integration-results.xml"
        tests=0; failures=0; errors=0; skipped=0
        if [ -f "${XML}" ]; then
          while IFS= read -r line; do
            if [[ "${line}" =~ \<testsuite[[:space:]] ]]; then
              t=$(echo "${line}"  | grep -oP 'tests="\K[0-9]+')
              f=$(echo "${line}"  | grep -oP 'failures="\K[0-9]+')
              e=$(echo "${line}"  | grep -oP 'errors="\K[0-9]+')
              s=$(echo "${line}"  | grep -oP 'skipped="\K[0-9]+')
              tests=$((tests + ${t:-0}))
              failures=$((failures + ${f:-0}))
              errors=$((errors + ${e:-0}))
              skipped=$((skipped + ${s:-0}))
            fi
          done < "${XML}"
        fi
        passed=$((tests - failures - errors - skipped))
        icon="✅"; [ $((failures + errors)) -gt 0 ] && icon="❌"
        {
          echo "### Integration Test Results (Full-stack)"
          echo ""
          echo "| Suite | Tests | Passed | Failed | Errors |"
          echo "|-------|-------|--------|--------|--------|"
          echo "| ${icon} Full-stack (Playwright) | ${tests} | ${passed} | ${failures} | ${errors} |"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Stop background services
      if: always()
      shell: bash
      run: |
        [ -n "${QUARKUS_PID}" ] && kill "${QUARKUS_PID}" 2>/dev/null || true
        [ -n "${VITE_PID}" ]    && kill "${VITE_PID}"    2>/dev/null || true
